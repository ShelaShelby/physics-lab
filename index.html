SIMS['Atom Lab'] = {
  update: '7.7.3',
  help: {label: '❓ What am I even looking at?', tip: 'A plain-words guide to the atom on screen', fn: (s, p, set) => lrnOpen('What am I even looking at?', b => lrnLook(b, p, set))},
  changelog: [
    ['7.7.3', 'Remembers Less info / More info', 'The Less info / More info button on the picture is now remembered. Pick one and it stays that way when you close and reopen Physics Lab, and when you change element. Before, it always started with whatever suited the screen size, which on a phone showed too much.'],
    ['7.7.2', 'The nucleon you dive into stays in focus', 'In the quark view, the depth-of-field look focused on the front of the nucleus. If you tapped a nucleon a bit deeper inside, its quarks came out blurred and without their u and d letters. Now the camera focuses on the nucleon you dived into: it is always sharp, with its letters, and it always shows its quarks, even in big nuclei where only the 45 nearest nucleons get quarks. Nucleons in front of it stay sharp, deeper ones blur.'],
    ['7.7.1', 'Cloud no longer slows other windows', 'Zoomed out, the electron cloud was drawn as about 10,000 separate little squares every frame. On a fast monitor that flooded the browser’s shared graphics process, so videos and streams in other windows could stutter or stop. Now all the dots go to the graphics chip in one go (WebGL), one draw instead of thousands, and the cloud looks the same. Zoomed in, with only a few dots on screen, the lab still draws them the old way, which is cheaper there. Without WebGL it falls back to the old way everywhere.'],
    ['7.7', 'Phase colours and every orbital', 'The Cloud, Cloud 3D and Slice views now colour the electron’s wave by its sign: the + half in the accent colour, the − half in orange. Where the two meet, the wave is zero and the electron is never found (a node), so the empty shells inside 2s, 3s and 4s and the flat node planes of p, d and f are easy to see. New Orientation setting: px, py and pz, all five d orbitals and all seven f orbitals. New orbitals 4s, 4p, 4d and 4f. Every shape comes from the exact hydrogen-like formula (radial Laguerre polynomial times the real angular shape chemists draw). Photon jumps follow the dipole rule for orientations too: light can only connect orientations whose overlap with x, y or z is not zero, so the cloud lands on a real, allowed shape.'],
    ['7.6', 'Faster, sharper quark view', 'Zooming into the quarks is several times smoother, most of all in big nuclei like uranium. The soft glow behind every proton and neutron is now painted once at a lower resolution (a blur has no fine detail, so nothing is lost), and only the sharp parts are drawn at full resolution. New depth-of-field look, like a camera focused on the front of the nucleus: the front nucleons’ quarks are sharp, the deeper ones are soft and faded, and their u / d letters are hidden. In Cinematic style the whole nucleus now sits on one dark backdrop, which also fixes a white glare that could appear on the light theme. Hard balls style gets the same focus effect.'],
    ['7.5', 'Light spectrum, decay history, half-lives in the table', 'New Light spectrum card: every line the atom on screen can give off, from the ultraviolet to the infrared, grouped in their series (for hydrogen: Lyman, Balmer, Paschen, Brackett and Pfund), with a to-scale strip of the visible part in the real colours. For hydrogen this is its real spectrum; for other elements it is the spectrum of that element with only one electron left, which is what this lab shows (a real ion, seen in hot plasmas and stars), and the card says so. Lines your photon jumps made are marked. The wavelengths now include the nucleus’s real mass (the electron and nucleus both circle their common centre), so hydrogen’s Hα is 656.47 nm instead of 656.1 nm, and photon jumps use the same numbers. Not included, and stated on the card: fine structure, the small splitting of each line by relativity, which grows large for heavy ions. New Decay history card: the whole chain since you last picked a nucleus, each step with how it decayed and how long it lived, and the total time. The periodic table now shows the half-life and decay types of the nucleus on screen (under the table), and of each element’s usual isotope (hover over a square).'],
    ['7', 'Real radioactive decay', 'Unstable nuclei now decay on their own, all the time, just as real ones do. Each one gets a random lifetime from its real half-life (the chance of decaying is the same every moment, whether you watch or not), and when it decays you see what flies out: an α particle, an electron and an antineutrino (β⁻), a positron and a neutrino (β⁺), neutrons or protons, a small cluster like carbon-14, or two fragments in a fission. The lab then follows the new nucleus, so decay chains go on by themselves: build oganesson-294 and within a fraction of a second it becomes livermorium, then flerovium, which may split in two. The readout shows the half-life, the ways it can decay with their real odds, and the chance it decays in the next minute (uranium-238: about 3×10⁻¹⁴ %). Half-lives and decay odds for 3,306 unstable nuclei come from NUBASE2020. Pausing stops the clocks, and so does holding a slider (so dragging through the isotopes does not set off decays). Very short-lived steps in a chain are shown one per frame so you can see them, but the times written are the real ones. After a fission, or a decay into something this lab cannot build, tap ☢ Build another to watch a fresh one. New achievement: Half-Life.'],
    ['6.7', 'Help guide on one page, with a jump bar', 'The “What am I even looking at?” guide is now one long page instead of dropdown boxes: every section is open, the headings stay as headings, and a row of tappable headings at the top jumps you to any section. Each heading also has a small ↑ that takes you back to that row. The text itself is unchanged.'],
    ['6.6', 'Bug fix: view buttons stay put', 'Changing the Electron picture (Cloud, Cloud 3D, Slice) could make the whole Electron card disappear, so you could not switch back. The card now stays, whatever picture you choose.'],
    ['6.5', 'Bohr 1913 style', 'New Orbit style setting (Orbit view only). Bohr 1913 draws the atom as Bohr did: the nucleus is one small ball with a plus sign (not to scale; neutrons were only found in 1932, so none are drawn), the allowed circles n = 1, 2, 3, 4 are drawn as clean rings with the electron’s circle in bold, and the electron is a ball with a minus sign. No quarks, no fuzz, no trail. The ↓ Emit photon and ↑ Absorb photon buttons work as before, and a flash marks where the electron lands after its jump. The readout only says what Bohr knew and the ❓ guide explains the picture. Modern is still the default. Also: the photon label no longer runs off the picture on a phone, and the Orbit view is now called “electron on a circle” to tell it apart from the Bohr style.'],
    ['6.3', 'Element card', 'Under the periodic table, the one-line note is now an element card: a tile with the atomic number and symbol, the name, its family, period and group, whether it is a solid, liquid or gas at room temperature, a ☢ flag if it has no stable isotope, and a plain-words line about where you meet it in daily life (Touchscreens for indium, Pepto-Bismol for bismuth, atomic clocks for caesium …). About 50 elements have their own line; the rest get one based on their family. The everyday facts were checked against several sources. The “What is to scale, and what is not” part of the ❓ guide has one more sentence. Read carefully and you may find something in it.'],
    ['6.2', 'Steadier quarks and a sharper info button', 'Fixed quarks flickering, disappearing and reappearing when you look closely at a nucleus. Nearby nucleons could swap their front-to-back order from one frame to the next, so one covered its neighbour’s quarks and then uncovered them. The order is now stable, and the choice of which nucleons get quarks no longer flips at the edge of the picture. In big nuclei only the 45 nearest nucleons get quarks, and as the nucleus turned or you moved the picture, nucleons kept passing that limit, so quark triplets appeared and disappeared out of thin air. Now each nucleon’s quarks fade in and out over about a third of a second, and its glow changes with them, so nothing pops. The ⓘ more info / less info button at the bottom left of the picture is now drawn as a proper icon instead of a text character, so it is sharp on every screen. It is also a little bigger and easier to tap, and it follows the text size setting.'],
    ['6.1', 'Every view can be dragged, picture can no longer get lost', 'Orbit: drag to turn the atom and see the orbit from other angles (it starts looking straight down, and a Reset view button and little axes appear once you turn it). Cloud: drag to move around at any zoom. Slice: drag up or down to slide the cut through the cloud. In Orbit, Cloud 3D and Slice, Shift-drag, right-drag or the ✥ button moves the picture instead. The Centre button now shows whenever the picture has been moved. If you moved the picture and then zoomed in, the electron cloud (or the nucleus) could end up off screen and the view looked empty. Now the picture always stays within reach at every zoom, and the ⌖ Centre button still brings it back.'],
    ['6', 'What am I even looking at?', 'A new ❓ button at the top opens a plain-words guide to the atom on screen: the nucleus, protons and neutrons, the quarks inside them, the electron, why only one electron is drawn, what the current picture (Orbit, Cloud, Cloud 3D or Slice) really shows, what every number at the top means, and what is to scale and what is not. It uses the element you have open, and every section opens and closes.'],
    ['5.6', 'Weight panel', 'New ⚖ Weight panel in the Learn card, for the atom you have open. Five tabs: the parts (what protons, neutrons and electrons weigh, and why electrons barely count), missing mass (the parts add up to more than the atom; the difference is the binding energy, E = mc²), how many atoms make up a grain of rice or a person, what is inside a proton (about 99 % of its weight is not quarks) and a mass ladder from the electron to the Sun. Binding energies come from measured masses of all 3,557 known isotopes (mendeleev database, checked against published values for He-4, C-12, Fe-56, U-238 and others); isotopes nobody has weighed use a formula and say so. The Scale and Weight panels now have a bar at the top: ◀ ▶ and a dropdown to change the element, and − / + / usual to change the neutron count. The panel updates at once, and the lab behind it changes too, so you never have to close the panel to compare elements.'],
    ['5.5', 'Temperature', 'Every element now has a facts box under the periodic table: melting point, boiling point (in K, °C and °F), its state at room temperature, density, and a bar showing where solid, liquid and gas begin. The ⓘ readout gets a short line too. A new Temperature card has a slider (0 to 6,000 K) with a little box of atoms: locked and jiggling as a solid, flowing as a liquid, flying as a gas. Buttons jump to cold, room temperature, just melted and just boiled. Special cases are explained: carbon and arsenic sublime, helium needs pressure to freeze, phosphorus and sulfur have several forms, and the heaviest elements were never measured. Data: Wikipedia data pages cross-checked with the mendeleev database. The Temperature card has a new “What is temperature, really?” explanation (temperature is the average motion of the atoms; heat, absolute zero, melting and boiling explained simply) and a live line with the typical speed of an atom of the chosen element at the chosen temperature.'],
    ['5', 'Realistic nucleus', 'The nucleons are no longer laid out on a tidy spiral. Their positions are now random samples from the real nuclear density (Woods–Saxon, as used in heavy-ion collision simulations), with no overlaps, a neutron skin that grows with the neutron excess, and the measured deformation: uranium-238 and the rare earths are stretched like rugby balls, silicon-28 is flattened, and magic-number nuclei such as lead-208 stay round. Deformation for nuclei without a measurement is an estimate from shell structure, and for the superheavy ones it is a guess. New 🎲 Reshuffle nucleons button: every click is another possible snapshot, since in reality no nucleon has a fixed place. The nucleus label now names the shape. The text at the top of the picture is now short: the essentials plus, when the nucleus is in view, its shape. Everything else (electron chance inside the nucleus, real half-life, relativity numbers, nucleon edge) sits behind a new ⓘ more info button at the bottom left of the picture; wide screens show it by default. The shape label moved from under the nucleus into the readout, so it no longer lands on the electron cloud. Long readout lines now wrap on narrow screens in every lab.'],
    ['4.5', 'Learn panels and a longer timeline', 'New Learn card with two panels. 📏 Scale: imagine the nucleus as a pea, marble, tennis ball, football or beach ball, and see how far away the electron would be, with real numbers for the element you have open (plus a powers-of-ten ruler from a hair down to a quark). 🕰 Timeline: nine steps from Democritus to quarks, each with a button that jumps to that model in the lab. The timeline grows from 9 to 22 steps: the periodic table, radioactivity, proof that atoms exist, the proton, electron waves, the Pauli rule, antimatter, fission, moving single atoms, oganesson, the Higgs boson and the first photo of an electron orbital. More ▶ buttons jump to matching atoms in the lab.'],
    ['4.1', 'Save image', 'New 📷 Save image button above the picture (works in every lab): saves exactly what you see, readout included, as a PNG. On a phone it opens the share sheet, where you can pick Save to Photos; on a computer it downloads to your Downloads folder.'],
    ['4', 'Realistic quarks', 'Quark style: Cinematic, Accurate or Classic. Quarks carry red, green or blue colour charge and swap colours as gluons pass between them; a flickering gluon field replaces the tubes; quarks are points with a soft halo. A mass bar shows quark masses are only about 1% of a proton. Heavy nuclei get a neutron-rich skin.'],
    ['3.5', 'Periodic table and isotopes', 'Click any of the 118 elements, hydrogen to oganesson. Real half-lives for every known isotope (3,557). Heavy atoms show X-rays in picometres and a relativity note. Fixed the electron orbit spinning too fast to see around big nuclei. Nucleus card moved to the top, with ± proton and neutron buttons. The side panel is wider, so the table is larger with clearer symbols. Elements with no stable isotope now have a dashed outline instead of faded italic text. A dropdown of 20 well-known nuclei (carbon-14, uranium-235, lead-208, cobalt-60 ...) with why each is famous. The − and + buttons now sit beside the Protons and Neutrons sliders. New Scale setting: Fixed draws every atom at the same scale, so you can watch orbits shrink as the nucleus grows. Changing protons now brings the usual neutron count with it. The Famous isotopes picker shows the isotope you chose. Changing the element keeps your zoom: the picture stays the same size on screen instead of jumping. Changing the isotope no longer drops the nucleon you were following. Once zoomed in, drag to move around the atom, nucleus or nucleon. In the 3D cloud, drag still rotates; Shift-drag, right-drag or the ✥ button moves. New Centre button.'],
    ['3', 'Elements, Slice view and presets', 'The nucleus label shows the real nuclide, e.g. Helium-4 (⁴He), and whether it is stable. Cross-section of the cloud, coloured by the wave\'s sign. Choose the cut direction and position. One-click nuclei (hydrogen-1, deuterium, helium-4, lithium-7). Settings survive switching labs and reloading. Defaults button. Protons 1–10, neutrons 0–12, real half-lives for every nucleus, X-ray photons for heavy nuclei, Carbon-12 / Oxygen-16 / Neon-20 presets. Each lab now shows its own update number. Small changes get a decimal. Click the Update badge to see this list.'],
    ['2.6*', 'Cleaner layout and names', 'Top bar decluttered; controls grouped into side cards. Dropdown options now say what they are, e.g. "Orbit (Bohr model)". Page scrolls over the canvas on phones; readout text wraps on narrow screens.'],
    ['2.5*', 'Photon jumps', 'Electron jumps between levels with emitted / absorbed photons and selection rules; the cloud morphs. Optional automatic emit / absorb. Every photon leaves a coloured line on a wavelength strip. Photon travels all the way to the canvas edge; wave-packet fix.'],
    ['2*', 'Zoom to the nucleus and the quarks', 'Zoom in to find the nucleus, with a scale bar. Atom Lab opens first; bug fixes and UI cleanup. Removed stray dots along the canvas edges. One continuous zoom from the electron cloud down to quarks and gluons. Nucleon edges follow the real charge density instead of a hard surface. Scale bar with powers of ten (1 fm = 10⁻¹⁵ m).'],
    ['1.5*', 'Probability cloud and 3D cloud', 'Electron shown as a cloud sampled from |ψ|². Rotatable 3D probability cloud.'],
    ['1*', 'Atom Lab is born', 'Nucleus with one electron on a Bohr orbit.'],
  ],

  const cu = dr ? 'grab' : 'default'; if (cv.style.cursor !== cu) cv.style.cursor = cu;
  document.querySelectorAll('.btns').forEach(r => { const hd = ![...r.children].some(c => !c.hidden); if (r.hidden !== hd) r.hidden = hd; });
  [...controlsEl.children].forEach(c => { const parts = [...c.querySelectorAll('label, .btns, .selRow')]; const hd = parts.length > 0 && parts.every(e => e.hidden); if (c.hidden !== hd) c.hidden = hd; });   // a card with nothing visible disappears   // no empty rows when every button in it is hidden
  const dt = Math.min((now - last)/1000, 0.05); last = now;
  fpsN++; if (now - fpsT >= 500) { fpsEl.textContent = Math.round(fpsN*1000/(now - fpsT)) + ' fps'; fpsN = 0; fpsT = now; }      // frames per second, shown in the corner of the picture
  if (sim.tick) sim.tick(state, params, dt);
  if (!paused) { acc += dt; while (acc >= DT) { sim.step(state, params, DT); acc -= DT; } }
  const w = cv.clientWidth, h = cv.clientHeight, c = css();
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height); ctx.restore();   // wipe the whole buffer
  sim.draw(ctx, state, params, w, h, c);
  if (sim.info) {
    ctx.font = '13px system-ui,sans-serif'; ctx.textAlign = 'left'; ctx.fillStyle = sim.hudDark ? '#cdd5e6' : c.muted;
    const rows = [];                                    // wrap the readout on narrow screens, breaking at " · "
    [].concat(sim.info(state, params)).forEach(t => {
      let cur = '';
      t.split('  ·  ').forEach(part => {
        const nx = cur ? cur + '  ·  ' + part : part;
        if (cur && ctx.measureText(nx).width > w - 24 - 56) { rows.push(cur); cur = part; } else cur = nx;
      });
      rows.push(cur);
    });
    for (let i = 0; i < rows.length; i++) {                 // a single long part still has to fit: break it at spaces
      if (ctx.measureText(rows[i]).width <= w - 24 - 56) continue;
      const words = rows[i].split(' '); let line = '', rest = [];
      for (let k = 0; k < words.length; k++) { const nx = line ? line + ' ' + words[k] : words[k]; if (line && ctx.measureText(nx).width > w - 24 - 56) { rest = words.slice(k); break; } line = nx; }
      rows[i] = line; if (rest.length) rows.splice(i + 1, 0, rest.join(' '));
    }
    ctx.lineJoin = 'round'; ctx.lineWidth = 3; ctx.strokeStyle = sim.hudDark ? '#03040a' : c.card;
    if (rows.length && rows.some(t => t)) {                       // a soft plate behind the readout so it stays readable over the picture (Physics Lab 8.6)
      let mw = 0; rows.forEach(t => { mw = Math.max(mw, ctx.measureText(t).width); });
      const px = 6, py = 4, rh = 17, bx = px, by = py, bw = mw + 12 + 8, bh = rh*rows.length + 10;
      ctx.save(); ctx.globalAlpha = sim.hudDark ? 0.5 : 0.72; ctx.fillStyle = sim.hudDark ? '#03040a' : c.card;
      ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(bx, by, bw, bh, 8); else ctx.rect(bx, by, bw, bh); ctx.fill(); ctx.restore();
    }
    rows.forEach((t, i) => { ctx.strokeText(t, 12, 21 + 17*i); ctx.fillText(t, 12, 21 + 17*i); });
  }
  if (hintEl) { const ht = sim.hint(params, state); if (hintEl.textContent !== ht) hintEl.textContent = ht; }
  requestAnimationFrame(frame);
}

const kindOf = n => SIMS[n].kind === 'game' ? 'game' : 'sim';
const orderedNames = Object.keys(SIMS).sort((a, b) => (b === 'Atom Lab') - (a === 'Atom Lab'));   // Atom Lab first
const lastOf = {};                                                                              // last lab opened in each slot
function fillKind(k, pick) {                                   // the top switch: Simulations and Games are separate slots

  names.forEach(n => simSel.add(new Option(n, n)));

  simSel.hidden = names.length < 2;
}
function showKind(k) { if (!orderedNames.some(n => kindOf(n) === k)) return; fillKind(k, lastOf[k]); load(simSel.value); }
document.getElementById('kSim').onclick = () => showKind('sim'); document.getElementById('kGame').onclick = () => showKind('game');
const achPane = document.getElementById('achPane'), achLayout = document.querySelector('.layout');
function paintAch() {                                          // the Achievements tab: every achievement, locked until earned

  });

}
function paintLearn() {                                        // the Learn tab: every guide and timeline, grouped by lab; tap one to open it in its lab
  achPane.textContent = '';
  achPane.appendChild(lrnEl('div', 'achHead', '<h2>📚 Learn</h2><div class="achCount">Plain-words guides and timelines for each lab. Tap one and the guide opens right here.</div>'));
  ['Atom Lab', 'Orbit Lab', 'Spacetime Lab'].forEach(lab => {
    const sec = lrnEl('div', 'learnSec'); sec.appendChild(lrnEl('h3', '', ({'Atom Lab': '⚛️ ', 'Orbit Lab': '🪐 ', 'Spacetime Lab': '🌀 '})[lab] + lab));
    const g = lrnEl('div', 'achGrid');

      const c = lrnEl('button', 'achCard learnCard', `<div class="achIc">${x.label.split(' ')[0]}</div><div class="achTx"><b>${x.title}</b><span class="d">${x.d}</span></div>`); c.type = 'button';
      c.onclick = () => {      // the guide opens over the Learn tab; its lab is loaded quietly behind the page so the guide can read it
        const prev = curName, sw = prev !== lab, back = n => { const h = achLayout.classList.contains('ach'); achLayout.classList.remove('ach'); load(n); if (h) achLayout.classList.add('ach'); };
        if (sw) back(lab);
        x.fn(state, params, setParam);

const APP_LOG = [
  {v: '8.6.2', t: 'Unlock everything (for testing)', d: 'Settings has a new Developer section with one button, Unlock everything. It unlocks every secret theme and every achievement at once, with no pop-ups, so they are easy to test. The Reset my progress button above it locks them all again.', ic: '🛠'},
  {v: '8.6.1', t: 'Bigger table without scrolling', d: 'The ⤢ Bigger table pop-up is now wide enough to show the whole periodic table at once, with no sideways scroll bar. On a phone the buttons shrink to fit.', ic: '🧪'},
  {v: '8.6', t: 'Tidy-up: readable, bigger, closer', d: 'Four small fixes from a design review. The facts written on top of the picture now sit on a soft see-through panel, so they stay readable even over bright clouds and stars. The periodic table has a new ⤢ Bigger table button that opens it large, with buttons big enough for a finger, scrolled to the element you have loaded. The small grey text all over the app is one step bigger (Settings still scales it). And in the Atom Lab the zoom buttons (Atom, Nucleus, Nucleon, Centre), Drag and Reset view now sit right under the picture instead of in a card further down.', ic: '🧹'},
  {v: '8.5.1', t: 'Reduced motion', d: 'Settings has a new Motion choice: Auto, Reduced or Full. Reduced is for anyone who feels dizzy or distracted when a lot moves on screen. Labs start paused with a ▶ Play button, camera moves jump straight to the end instead of gliding, Cloud 3D does not spin by itself, the Did you know facts change only when you tap them, and pop-ups appear without sliding or fading. The physics stays exactly the same. Auto (the default) follows the device’s own “reduce motion” setting. Your choice is remembered between visits.'},
  {v: '8.5', t: 'Unit switch', d: 'Settings has a new Units choice: Metric or Imperial. It changes the distances, speeds and temperatures the labs work out: planet, moon, comet and star cards in the Orbit Lab, its scale bar, the Black Hole readout, element melting and boiling points, the room temperature line and atom speeds in the Atom Lab, and the size comparisons in the Atom Lab Scale guide. Science units (nm, K, kg) and the written guides stay as they are. Your choice is remembered between visits.'},
  {v: '8.4.6', t: 'Spectrum, decay history and lighter orbits', d: 'Atom Lab 7.5 brings a Light spectrum card, a Decay history card and half-lives in the periodic table. Orbit Lab 7.7.1 draws its trails with less work and looks exactly the same.'},
  {v: '8.4.5', t: 'Half-Life achievement', d: 'A new achievement: watch an unstable nucleus decay in the Atom Lab. Radioactive decay arrived in Atom Lab 7: every unstable nucleus now decays on its own at its real half-life.'},
  {v: '8.4.4', t: 'Smoother frames in every lab', d: 'Every frame, the app used to rewrite the hint text and the buttons and re-read the theme colours, even when nothing had changed, which made the browser lay out the whole page again 60 times a second. Now it only touches the page when something really changes, and reads the colours only when you change the theme. Also in this update: Orbit Lab 7.7 (faster at high time speed) and Black Hole Lab 3.3 (spin labels fixed, lighter when paused) and Spacetime Lab 2.6.1 (a crash with heavy neutron stars fixed).'},
  {v: '8.4.3', t: 'Help guides on one page', d: 'The Orbit, Atom and Spacetime Lab help guides are no longer dropdown boxes. Each is one long page with its headings kept, a row of tappable headings at the top to jump around, and a small ↑ on every heading to come back.'},
  {v: '8.4.2', t: 'Learn tab keeps you on the Learn tab', d: 'Tapping a guide or timeline in the 📚 Learn tab now opens it right there instead of switching you into that lab. Close it and you are back on the Learn list, in the lab you were in before.'},
  {v: '8.4.1', t: 'Sources for the Sun, seasons and the new timeline steps', d: 'The About page now lists where the Orbit Lab’s newest facts come from: the Sun’s real spin, why Earth has seasons (with the 2026 equinox and solstice times), and each of the new Solar System timeline steps, from Huygens and Saturn’s ring to the 2020 Nobel Prize for weighing the black hole at the centre of our galaxy.'},
  {v: '8.4', t: 'Galactic Center achievement', d: 'A fourth achievement: click the black hole at the centre of our galaxy (Sagittarius A*) in the Orbit Lab. Zoom a very long way out, or tap it under Far away, and it is yours.'},
  {v: '8.3', t: 'Sources for the Orbit Lab’s spinning planets', d: 'The About page now lists where the Orbit Lab’s spinning planets and its Jump to a date come from: the IAU report on how each planet turns and leans, and the pages behind the famous dates (Mars in 2003, the 2020 great conjunction, the 2012 transit of Venus, Halley’s Comet and the discovery of Neptune).', ic: '🌍'},
  {v: '8.2', t: 'Sources for the Orbit Lab’s stars', d: 'The About page now credits the star data behind the Orbit Lab’s new night sky and far-away things (the HYG star database and Stellarium’s constellation lines, both CC BY-SA 4.0) and lists the sources for the Voyagers and the far-away objects.', ic: '📚'},
  {v: '8.1', t: 'Sources for the Spacetime Lab', d: 'The About page now lists the scientific sources behind the Spacetime Lab: the papers and pages for the Schwarzschild spacetime, the shape of space, the marble paths and clock slowing, and the measurements of the real objects (the Sun, the Moon, the heavy neutron star, Cygnus X-1, Sagittarius A* and M87*).', ic: '📚'},
  {v: '8', t: 'Spacetime Lab', d: 'A fourth simulation: gravity as bent spacetime. A grid shows the bend around a star, a black hole, a planet, a Moon, a human or a basketball, and you can roll marbles across it to see them circle, fall in or fly by. A Bend setting switches between Easy to see and True proportions (a human makes no dent at all), and the readout shows each object’s real mass, size, horizon radius and escape speed. A guide explains what everything is and what the picture gets wrong, and it is in the Learn tab too (Spacetime Lab 1).', ic: '🌀', lab: ['Open Spacetime Lab', 'Spacetime Lab']},
  {v: '7.6', t: 'Buttons instead of drop-down menus', d: 'Every setting that used to open a drop-down menu is now a row of buttons you can always see, with the one in use highlighted: the electron pictures in the Atom Lab (Orbit, Cloud, Cloud 3D, Slice), Orbit style, quark style, On and Off switches in every lab, Quality in the Black Hole Lab, and more. A small note under the row explains the chosen option. The lab picker at the top and the Famous atoms list in the Atom Lab are still menus, because their lists are longer.', ic: '🔘'},
  {v: '7.5', t: 'Learn tab, Learn cards higher up', d: 'A new 📚 Learn tab sits next to Simulations, Games and Achievements. It lists every guide and timeline (the Atom Lab’s guide, Scale, Weight and Timeline, and the Orbit Lab’s guide and Timeline). Tap one and it opens in its lab. The Learn card in the Orbit Lab and the Atom Lab also moved up: it is now the third card in the Orbit Lab (under Time speed) and the second card in the Atom Lab (under the periodic table). On phones the four tabs now sit in two rows so none is cut off.', ic: '📚'},
  {v: '7.1', t: 'Clearer progress reset', d: 'Settings → Progress → Reset my progress now opens a pop-up page. It says this is permanent and lists exactly what will be locked again (for example 2 secret themes and 3 achievements). After you confirm, a second pop-up says Progress reset with what was locked, and the Settings page shows a highlighted Done line. If you have nothing unlocked yet, it tells you there is nothing to reset.', ic: '🔒'},
  {v: '7', t: 'Achievements', d: 'A new 🏆 Achievements tab next to Simulations and Games shows every achievement, locked until you earn it. When you earn one, a small pop-up slides in at the corner of the screen for a few seconds and goes away by itself, so it never blocks what you are doing. The first three: Neon Nights (find the secret Synthwave theme), Sharp Eyes (find the secret Monochrome theme) and Point of No Return (zoom all the way in on a black hole). Settings → Progress now locks the achievements again too. Also new: the About page lists sources for the Black Hole Lab, the moons and Bohr’s 1913 paper.', ic: '🏆'},
  {v: '6.9', t: 'Atom Lab: Bohr 1913 style, plus many fixes', d: 'The Orbit view has a new Orbit style setting. “Bohr 1913” draws the atom the way Niels Bohr drew it: one small nucleus ball with a plus sign, the fixed circles n = 1 to 4, and one electron ball. No neutrons, no quarks. ↓ Emit photon and ↑ Absorb photon make the electron leap between circles with a flash. The Modern style is still there. Also fixed the photon label running off the edge of the picture on phones. Also in this update: the Black Hole Lab got a Quality setting (Auto, High, Medium and Low, so phones run smoother) and rendering fixes (a dotted line through the picture, a hairline seam, a broken patch when looking down on the disc; the Viewing angle now starts at 20°). The Orbit Lab lets go of a planet without a jump, zooms deep more smoothly (the Ceres lag is fixed), starts every belt view the same way, and has short tails with a new Trails setting. Slider knobs now always drag, and the update list no longer shows “undefined” on phones.', ic: '⚛️'},
  {v: '6.8', t: 'FPS counter, exact comet orbits, progress reset and Orbit guide', d: 'Every lab now shows its frames per second in the top right corner of the picture. In Orbit Lab the comets stay exactly on their orbit line at any zoom (before, they slid off it and seemed to bounce when zoomed far in). Settings has a new Progress part with a Reset button that locks the secret themes again, after an “are you sure” step. I also timed both Orbit Lab and Atom Lab across all their views, zoom levels and time speeds and tried random taps and drags: no other slow parts or errors turned up. Orbit Lab now has the same ❓ guide as Atom Lab. It explains in plain words what every ring, dot, line and colour on the picture means, what is to scale and what is not, what Time speed means, why the Sun wobbles, and how comets get their tails. It also shows live facts about what you have open and selected.', ic: '❓'},
  {v: '6.7', t: 'Orbit Lab: scale bar, famous comets, no lag near the Sun, and a secret theme', d: 'A scale bar with light travel time, and six famous comets on their real orbits with glowing heads and tails: Halley, Hale–Bopp, NEOWISE, Encke, 67P and Swift–Tuttle. A new secret colour theme hides somewhere in the app. It stays a ??? in the 🎨 Theme list until you find it. Clue: read the Atom Lab guide closely. Zooming in close to the Sun (or anywhere the comets\' dotted orbits run far off screen) made the app crawl. Only the part of each comet orbit that is on screen is drawn now, so it stays smooth.', ic: '☄️'},
  {v: '6.6', t: 'Orbit Lab: real-looking planets, Sun and true scale', d: 'Planets, moons and the Sun became lit balls, then smooth single-colour balls with a soft glowing Sun that spins. The Orbit Lab now starts at 1 s = 29 days, and moons follow the Time speed properly. A new Barycentre marker shows the real balance point of the Sun and planets, which the Sun wobbles around. True scale: planets, moons and the Sun are drawn at their real size, zoom goes up to ×300,000, Earth has real continents and clouds, and there is no minimum dot any more (bodies smaller than a pixel are marked with a small ring). A Sizes setting brings back the bigger planets. The Time speed slider moved up, right under Reset to today.', ic: '🪐'},
  {v: '6.5', t: 'Orbit Lab: Go to table', d: 'A new Go to card in Orbit Lab with a tile for the Sun, every planet, dwarf planet and moon, and the belts and the far edge. Tap one and the view flies there. Trails behind far-away bodies, the dwarf planets most of all, no longer lag behind and jump: they always reach the body. The note at the top left of the picture now shows the real date as time passes, for example 29 Sep 2126 after 100 years. Going to a planet, moon or belt no longer changes the time speed you chose. The mouse wheel zooms in smaller steps in Orbit Lab, so far-away dwarf planets are easier to reach. The ring around the selected planet, moon or Sun is now bright pink with a dark edge. Belts and the Oort cloud light up in pink with a name tag when you go to them. Tap a selected Go to tile again to deselect it. Orbit Lab now has the little x y z axes at the bottom right, like Atom Lab.', ic: '🚀'},
  {v: '6.4', t: 'Atom Lab: steadier quarks, sharper info button, element card', d: 'Fixed the quark triplets that flickered, disappeared and reappeared when you looked closely at a nucleus. Quark triplets no longer appear and disappear out of thin air in big nuclei: they fade in and out smoothly as you turn or move the picture. The ⓘ info button in Atom Lab is now a sharp, drawn icon, a little bigger and easier to tap. Every element now has a card under the periodic table: its tile, family, period and group, state at room temperature, and a plain-words line about where you meet it in daily life.', ic: '🧪'},
  {v: '6.3', t: 'Language, About, Settings and sources', d: 'A new 🌐 button in the header lets you pick a language: English works now, and Estonian is marked “Coming soon” (the translation is next on the planned list). A new 👤 About button tells you who makes Physics Lab, what it is built with and where the facts come from. A new ⚙ Settings button in the header. It has a Text size setting (small, normal, large, extra large) and a Font setting (theme default, serif, easy to read, rounded, monospace). Both change the text across the whole app, including the labels drawn inside the labs, and are remembered. More settings can go there later. The About page now links to the main sources behind Physics Lab’s facts: NASA/JPL for the planets, NUBASE and the Particle Data Group for atoms and particles, and Wikipedia and other pages for the everyday element facts.', ic: '⚙️'},
  {v: '6.2', t: 'Atom Lab: “What am I even looking at?” and every view draggable', d: 'A new ❓ button in Atom Lab explains the atom on screen in plain words, with sections you can open and close: nucleus, protons, neutrons, quarks, the electron, and what each picture and number means. It follows the element you pick. All four electron views can be dragged now. Orbit turns in 3D, Cloud slides around, Slice moves its cut through the cloud, and Cloud 3D rotates as before. Fixed a bug where the electron cloud seemed to disappear: moving the picture and then zooming in could push it off screen. It now always stays in view.', ic: '❓'},
  {v: '6.1', t: 'Orbit Lab: moons stay visible', d: 'Fixed a bug where moons (Earth’s Moon, the moons of Mars and others) disappeared at some angles in the 3D view.', ic: '🌙'},
  {v: '6', t: 'Colour themes and the “Did you know?” line', d: 'A line at the top of the screen shows a physics fact and swaps to a new one every few seconds. Tap it to skip to the next fact. There are 25 facts about space, temperature and atoms. A new 🎨 Theme button in the header opens a short list: Auto (follows your device), Light, Dark, Black, Midnight, Solar and Paper. Your choice is remembered on this device. All labs use the new colours. Sage (a calm, cool grey-green) and High contrast (black with white text and yellow accents) join the 🎨 Theme list. The list also scrolls now when the screen is short, such as a phone held sideways. The fact line now shows which fact you are on (like 3/26) and waits while you hold it with your finger or hover over it with the mouse, so you can finish reading. There is one new fact too, and it is a surprise. There is a new locked slot at the bottom of the 🎨 Theme list, and now 27 facts in the 💡 line. Keep reading the facts to find out how to open it.', ic: '🎨'},
  {v: '5.6', t: 'Weight panel', d: 'A new Learn panel in Atom Lab about weight: what an atom and its parts weigh, the missing mass and binding energy, how many atoms are in everyday things, why a proton’s weight is mostly not quarks, and a mass ladder from the electron to the Sun (Atom Lab 5.6).', ic: '⚖', lab: ['Open Atom Lab','Atom Lab']},
  {v: '5.5', t: 'Temperature in the Atom Lab', d: 'Every element shows its melting and boiling point, state at room temperature and density. A temperature slider shows atoms as a solid, liquid or gas (Atom Lab 5.5).', ic: '🌡', lab: ['Open Atom Lab','Atom Lab']},
  {v: '5.1', t: 'Physics Lab history', d: 'A timeline of the app itself, opened from the 🕰 button next to the title. It lists every big step so far, with a ▶ button that jumps to the lab or game it is about, and what is planned next.', ic: '🕰'},
  {v: '5', t: 'Orbit Lab: the real Solar System', d: 'Orbit Lab was simplified to just the real Solar System, placed where everything is today. It got a 21-step timeline from wandering stars to DART, and time speed that goes down to real time (Orbit Lab 2.5).', ic: '☉', lab: ['Open Orbit Lab','Orbit Lab']},
  {v: '4.6', t: 'A realistic nucleus, and phone fixes', d: 'Protons and neutrons are placed like a real nucleus (random, non-overlapping, neutron skin, measured deformation such as uranium’s rugby-ball shape). Shorter readout with an ⓘ button, and long text wraps on phones in every lab (Atom Lab 5).', ic: '⚛️', lab: ['Open Atom Lab','Atom Lab']},
  {v: '4.5', t: 'Learn panels', d: 'Atom Lab gained a scale comparison (“if the nucleus were a football …”), a powers-of-ten ruler and a 22-step timeline of how we pictured the atom, with buttons that jump to the matching atom (Atom Lab 4.5).', ic: '🎓', lab: ['Open Atom Lab','Atom Lab']},
  {v: '4', t: 'The first game: Slingshot', d: 'A game inside the lab: launch a spacecraft from Earth on a real date, aim by dragging, and reach a planet with limited fuel. Six missions from Venus to Neptune’s orbit, a quiz for each, stars for fuel saved, and a Simulations / Games switch at the top (Slingshot 1).', ic: '🚀', lab: ['Play Slingshot','Slingshot']},
  {v: '3.5', t: 'Save image', d: 'A 📷 Save image button in every lab saves exactly what you see as a PNG (Atom Lab 4.1).', ic: '📷'},
  {v: '3', t: 'Black Hole Lab', d: 'The third lab: a black hole with a glowing accretion disc that bends light, drawn on the GPU (with a slower fallback), and then spin, using the equations for a rotating Kerr black hole (Black Hole Lab 1–3).', ic: '🕳️', lab: ['Open Black Hole Lab','Black Hole Lab']},

(() => {
  const btn = document.getElementById('langBtn'), LANGS = [['en', 'English', '🇬🇧'], ['et', 'Eesti keel', '🇪🇪', true]];
  let menu = null, cur = 'en';
  try { const v = localStorage.getItem('plLang'); if (v === 'en') cur = v; } catch (e) {}
  const label = () => { btn.textContent = '🌐 ' + LANGS.find(l => l[0] === cur)[1]; };
  const close = () => { if (!menu) return; menu.remove(); menu = null; btn.setAttribute('aria-expanded', 'false'); document.removeEventListener('pointerdown', away, true); document.removeEventListener('keydown', key, true); window.removeEventListener('resize', close); };
  const away = e => { if (menu && !menu.contains(e.target) && e.target !== btn) close(); };
  const key = e => { if (e.key === 'Escape') { close(); btn.focus(); } };
  btn.onclick = () => {
    if (menu) { close(); return; }
    menu = document.createElement('div'); menu.id = 'langMenu'; menu.setAttribute('role', 'menu');
    LANGS.forEach(([id, name, flag, soon]) => {
      const b = document.createElement('button'); b.type = 'button'; b.setAttribute('role', 'menuitemradio'); b.setAttribute('aria-checked', String(id === cur));
      if (id === cur) b.className = 'on';
      b.innerHTML = `<span style="font-size:18px">${flag}</span><span class="nm">${name}</span>` + (soon ? '<span class="soon">Coming soon</span>' : '<span class="ck">✓</span>');
      if (soon) b.disabled = true; else b.onclick = () => { cur = id; try { localStorage.setItem('plLang', id); } catch (e) {} label(); close(); };
      menu.appendChild(b);
    });
    document.body.appendChild(menu);
    const r = btn.getBoundingClientRect(), w = menu.offsetWidth;
    menu.style.top = Math.max(8, Math.min(r.bottom + 6, innerHeight - menu.offsetHeight - 8)) + 'px';
    menu.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + 'px';
    btn.setAttribute('aria-expanded', 'true');
    document.addEventListener('pointerdown', away, true); document.addEventListener('keydown', key, true); window.addEventListener('resize', close);
    const on = menu.querySelector('.on'); if (on) on.focus();
  };
  label();
})();

ef="https://en.wikipedia.org/wiki/Proton" target="_blank" rel="noopener noreferrer">Proton</a>, <a href="https://en.wikipedia.org/wiki/Neutron" target="_blank" rel="noopener noreferrer">Neutron</a>, <a href="https://en.wikipedia.org/wiki/Atomic_nucleus" target="_blank" rel="noopener noreferrer">Atomic nucleus</a>, <a href="https://en.wikipedia.org/wiki/Bohr_model" target="_blank" rel="noopener noreferrer">Bohr model</a>, <a href="https://en.wikipedia.org/wiki/Atomic_orbital" target="_blank" rel="noopener noreferrer">Atomic orbital</a></li><li><a href="https://zenodo.org/record/2493915" target="_blank" rel="noopener noreferrer">Niels Bohr, 1913: On the constitution of atoms and molecules, Part I</a> (the 1913 paper behind the Bohr 1913 style)</li></ul><div class="srcH">🕳️ Black holes</div><ul class="srcL"><li><a href="https://arxiv.org/abs/1502.03808" target="_blank" rel="noopener noreferrer">James, von Tunzelmann, Franklin and Thorne, 2015: Gravitational lensing by spinning black holes in astrophysics, and in the movie Interstellar</a> (how light is traced around a spinning black hole)</li><li><a href="https://en.wikipedia.org/wiki/Kerr_metric" target="_blank" rel="noopener noreferrer">Wikipedia: the Kerr metric</a> (the spacetime of a spinning black hole)</li><li><a href="https://en.wikipedia.org/wiki/Innermost_stable_circular_orbit" target="_blank" rel="noopener noreferrer">Wikipedia: innermost stable circular orbit</a> (where the bright disc ends)</li></ul><div class="srcH">🌀 Spacetime and real objects</div><ul class="srcL"><li><a href="https://en.wikipedia.org/wiki/Schwarzschild_metric" target="_blank" rel="noopener noreferrer">Wikipedia: the Schwarzschild metric</a> (the spacetime of a round, non-spinning object; Flamm’s paraboloid, the real shape of space, is explained here)</li><li><a href="https://en.wikipedia.org/wiki/Interior_Schwarzschild_metric" target="_blank" rel="noopener noreferrer">Wikipedia: the interior Schwarzschild metric</a> (the spacetime inside an object of the same density everywhere)</li><li><a href="https://en.wikipedia.org/wiki/Schwarzschild_geodesics" target="_blank" rel="noopener noreferrer">Wikipedia: Schwarzschild geodesics</a> (the paths the marbles follow, circular orbits and the last steady orbit)</li><li><a href="https://en.wikipedia.org/wiki/Gravitational_time_dilation" target="_blank" rel="noopener noreferrer">Wikipedia: gravitational time dilation</a> (why clocks tick slower deeper in gravity)</li><li><a href="https://arxiv.org/abs/1510.07674" target="_blank" rel="noopener noreferrer">IAU 2015 Resolution B3</a> (the official nominal mass and radius of the Sun)</li><li><a href="https://nssdc.gsfc.nasa.gov/planetary/factsheet/moonfact.html" target="_blank" rel="noopener noreferrer">NASA: Moon fact sheet</a> (mass and radius; Earth’s are in the planetary fact sheet above)</li><li><a href="https://arxiv.org/abs/2104.00880" target="_blank" rel="noopener noreferrer">Fonseca et al., 2021: Refined mass and geometric measurements of PSR J0740+6620</a> (the heavy neutron star, 2.08 Suns)</li><li><a href="https://arxiv.org/abs/2102.09091" target="_blank" rel="noopener noreferrer">Miller-Jones et al., 2021: Cygnus X-1 contains a 21-solar mass black hole</a> (Science)</li><li><a href="https://arxiv.org/abs/2112.07478" target="_blank" rel="noopener noreferrer">GRAVITY Collaboration, 2022: mass distribution in the Galactic Centre</a> (Sagittarius A*, 4.3 million Suns)</li><li><a href="https://arxiv.org/abs/1906.11238" target="_blank" rel="noopener noreferrer">Event Horizon Telescope, 2019: First M87 results I, the shadow of the black hole</a> (M87*, 6.5 billion Suns)</li></ul><div class="lrnP lrnMuted">The 1.4-Sun, 12 km neutron star is a typical textbook example, not one particular star, and the 70 kg human and 0.6 kg basketball are round numbers.</div><div class="srcH">🌌 Stars and far-away things</div><ul class="srcL"><li><a href="https://github.com/astronexus/hyg-database" target="_blank" rel="noopener noreferrer">HYG star database v4.1 (David Nash, astronexus)</a> (the stars and their colours, built from the Hipparcos, Yale and Gliese catalogues; licence CC BY-SA 4.0, changed here into the ecliptic coordinates of the planets)</li><li><a href="https://github.com/Stellarium/stellarium" target="_blank" rel="noopener noreferrer">Stellarium: the “modern” constellation lines</a> (licence CC BY-SA 4.0)</li><li><a href="https://theskylive.com/voyager1-info" target="_blank" rel="noopener noreferrer">The Sky Live: Voyager 1</a></li><li><a href="https://theskylive.com/voyager2-info" target="_blank" rel="noopener noreferrer">The Sky Live: Voyager 2</a> (their sky positions and distances on 30 Sep 2026)</li><li><a href="https://en.wikipedia.org/wiki/Voyager_1" target="_blank" rel="noopener noreferrer">Wikipedia: Voyager 1</a></li><li><a href="https://en.wikipedia.org/wiki/Voyager_2" target="_blank" rel="noopener noreferrer">Wikipedia: Voyager 2</a> (speeds, and the dates they reached the Sun’s wind edge)</li><li><a href="https://en.wikipedia.org/wiki/Heliosphere" target="_blank" rel="noopener noreferrer">Wikipedia: the heliosphere</a> (where the Voyagers crossed the heliopause: 121 AU in 2012 and 119 AU in 2018)</li><li><a href="https://en.wikipedia.org/wiki/Alpha_Centauri" target="_blank" rel="noopener noreferrer">Wikipedia: Alpha Centauri</a> (4.34 and 4.24 light years)</li><li><a href="https://en.wikipedia.org/wiki/Pleiades" target="_blank" rel="noopener noreferrer">Wikipedia: the Pleiades</a> (Gaia distance, 444 light years)</li><li><a href="https://en.wikipedia.org/wiki/Orion_Nebula" target="_blank" rel="noopener noreferrer">Wikipedia: the Orion Nebula</a> (1,267 light years)</li><li><a href="https://en.wikipedia.org/wiki/Sagittarius_A*" target="_blank" rel="noopener noreferrer">Wikipedia: Sagittarius A*</a> (27,000 light years)</li></ul><div class="lrnP lrnMuted">Distances of Polaris, Betelgeuse and Rigel are uncertain, so they are rounded.</div><div class="srcH">🌍 S isted under Space and orbits.</div><div class="srcH">☀️ The Sun, seasons and the timeline</div><ul class="srcL"><li><a href="https://github.com/CS-SI/Orekit/blob/develop/src/main/java/org/orekit/bodies/PredefinedIAUPoles.java" target="_blank" rel="noopener noreferrer">Orekit: the IAU models as code</a> (the Sun’s pole, 286.13° and 63.87°, and its turning rate, 14.1844° a day)</li><li><a href="https://en.wikipedia.org/wiki/Solar_rotation" target="_blank" rel="noopener noreferrer">Wikipedia: solar rotation</a> and <a href="https://en.wikipedia.org/wiki/Sun" target="_blank" rel="noopener noreferrer">the Sun</a> (the equator turns faster than the poles; the axis leans 7.25°)</li><li><a href="https://science.nasa.gov/earth/facts/" target="_blank" rel="noopener noreferrer">NASA: Earth facts</a> (the 23.4° tilt, and that the tilt, not the distance, causes the seasons)</li><li><a href="https://en.wikipedia.org/wiki/Apsis" target="_blank" rel="noopener noreferrer">Wikipedia: apsis</a> (Earth’s closest and farthest distance from the Sun, with the 2026 dates)</li><li><a href="https://en.wikipedia.org/wiki/Solstice" target="_blank" rel="noopener noreferrer">Wikipedia: solstice</a> (the 2026 equinox and solstice times)</li><li>Saturn’s ring: <a href="https://en.wikipedia.org/wiki/Christiaan_Huygens" target="_blank" rel="noopener noreferrer">Wikipedia: Christiaan Huygens</a> and <a href="https://dwc.knaw.nl/en/?p=2435" target="_blank" rel="noopener noreferrer">the Huygens ring discovery (KNAW)</a></li><li>The Sun is not the centre of the galaxy: <a href="https://www.britannica.com/biography/Harlow-Shapley" target="_blank" rel="noopener noreferrer">Britannica: Harlow Shapley</a> and <a href="https://en.wikipedia.org/wiki/Galactic_Center" target="_blank" rel="noopener noreferrer">Wikipedia: Galactic Center</a></li><li>Landing on Venus and Mars: <a href="https://en.wikipedia.org/wiki/Venera_7" target="_blank" rel="noopener noreferrer">Wikipedia: Venera 7</a>, <a href="https://solarviews.com/eng/venera7.htm" target="_blank" rel="noopener noreferrer">Solarviews: Venera 7</a>, <a href="https://en.wikipedia.org/wiki/Viking_1" target="_blank" rel="noopener noreferrer">Wikipedia: Viking 1</a> and <a href="https://science.nasa.gov/mission/viking-1/" target="_blank" rel="noopener noreferrer">NASA: Viking 1</a> (the sources disagree on how long Venera 7 transmitted, so the text gives no number)</li><li>A comet hits Jupiter: <a href="https://en.wikipedia.org/wiki/Comet_Shoemaker%E2%80%93Levy_9" target="_blank" rel="noopener noreferrer">Wikipedia: Comet Shoemaker–Levy 9</a> and <a href="https://www.britannica.com/topic/Comet-Shoemaker-Levy-9" target="_blank" rel="noopener noreferrer">Britannica</a></li><li><a href="https://en.wikipedia.org/wiki/Voyager_1" target="_blank" rel="noopener noreferrer">Wikipedia: Voyager 1</a> (leaving the Sun’s wind, 25 Aug 2012, 121 AU)</li><li>Comet landing and Ceres: <a href="https://en.wikipedia.org/wiki/Rosetta_(spacecraft)" target="_blank" rel="noopener noreferrer">Wikipedia: Rosetta</a>, <a href="https://www.jpl.nasa.gov/news/rosettas-philae-makes-historic-first-landing-on-a-comet/" target="_blank" rel="noopener noreferrer">NASA/JPL: Philae’s landing</a>, <a href="https://en.wikipedia.org/wiki/Dawn_(spacecraft)" target="_blank" rel="noopener noreferrer">Wikipedia: Dawn</a> and <a href="https://science.nasa.gov/mission/dawn/" target="_blank" rel="noopener noreferrer">NASA: Dawn</a></li><li>Touching the Sun: <a href="https://en.wikipedia.org/wiki/Parker_Solar_Probe" target="_blank" rel="noopener noreferrer">Wikipedia: Parker Solar Probe</a> and <a href="https://science.nasa.gov/mission/parker-solar-probe/" target="_blank" rel="noopener noreferrer">NASA: Parker Solar Probe</a> (the corona crossing was on 28 Apr 2021 and announced in Dec 2021)</li><li>Weighing the black hole: <a href="https://www.nobelprize.org/prizes/physics/2020/press-release/" target="_blank" rel="noopener noreferrer">The 2020 Nobel Prize in Physics</a> window.PLAch = (() => {
  const list = [
    {id: 'synthwave', ic: '🌆', name: 'Neon Nights', how: 'A surprise is hiding in the 💡 facts.', done: 'You found the surprise and unlocked the secret Synthwave theme.'},
    {id: 'monochrome', ic: '🔍', name: 'Sharp Eyes', how: 'A word in the ❓ Atom Lab guide holds the key.', done: 'You read the Atom Lab guide closely and unlocked the secret Monochrome theme.'},
    {id: 'blackhole', ic: '🕳️', name: 'Point of No Return', how: 'Zoom in on the black hole in the Black Hole Lab as far as you can.', done: 'You zoomed all the way in on a black hole. Nothing comes back out.'},
    {id: 'decay', ic: '☢️', name: 'Half-Life', how: 'Watch an unstable nucleus decay in the Atom Lab.', done: 'You watched a nucleus decay on its own, at its real half-life.'},
    {id: 'galactic', ic: '🌌', name: 'Galactic Center', how: 'Find the black hole at the centre of our galaxy in the Orbit Lab and click it.', done: 'You found Sagittarius A*, the black hole at the centre of our galaxy, 27,000 light years away.'}
  ];
  const mem = {};
  const read = () => { try { return JSON.parse(localStorage.getItem('plAch') || '{}') || {}; } catch (e) { return Object.assign({}, mem); } };
  const write = o => { Object.keys(mem).forEach(k => delete mem[k]); Object.assign(mem, o); try { localStorage.setItem('plAch', JSON.stringify(o)); } catch (e) {} };
  const has = id => id in read(), when = id => read()[id] || 0;
  let box = null, queue = [], busy = false;
  const next = () => {
    if (busy || !queue.length) return; busy = true;
    const a = queue.shift();
    if (!box) { box = document.createElement('div'); box.id = 'achToast'; box.setAttribute('role', 'status'); box.setAttribute('aria-live', 'polite'); document.body.appendChild(box); }
    const el = document.createElement('div'); el.className = 'achPop';
    el.innerHTML = `<div class="achIc">${a.ic}</div><div class="achTx"><small>Achievement unlocked</small><b>${a.name}</b><span class="d">${a.done}</span></div>`;
    box.appendChild(el); requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('in')));
    setTimeout(() => { el.classList.remove('in'); setTimeout(() => { el.remove(); busy = false; next(); }, 400); }, 5200);
  };
  const grant = (id, silent) => {
    const a = list.find(x => x.id === id); if (!a) return false;
    const o = read(); if (id in o) return false;
    o[id] = silent ? 0 : Date.now(); write(o);
    if (!silent) setTimeout(() => { queue.push(a); next(); }, 700);
    if (window.PLAchRefresh) window.PLAchRefresh();
    return true;
  };
  const reset = () => { write({}); queue = []; if (window.PLAchRefresh) window.PLAchRefresh(); };
  return {list, has, when, grant, reset};
})();

    if (navigator.canShare && navigator.canShare({files: [file]})) { await navigator.share({files: [file]}); flash('Saved ✓'); return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); flash('Saved ✓');
  } catch (e) { flash(e && (e.code === 'declined' || e.name === 'AbortError') ? 'Cancelled' : 'Could not save'); }
};
document.getElementById('reset').onclick = () => { state = sim.init(params); };
let dragging = false, lx = 0, ly = 0, pinch0 = 1, down = null;
const ptrs = new Map();
const pdist = () => { const [a, b] = [...ptrs.values()]; return Math.hypot(a.x - b.x, a.y - b.y) || 1; };
cv.addEventListener('pointerdown', e => {
  ptrs.set(e.pointerId, {x: e.clientX, y: e.clientY}); cv.setPointerCapture(e.pointerId);
  down = ptrs.size === 1 ? {x: e.clientX, y: e.clientY} : null;      // remembered so a tap can be told from a drag
  if (ptrs.size === 2) { pinch0 = pdist(); dragging = false; }
  else if (sim.draggable && sim.draggable(params, state)) { dragging = true; lx = e.clientX; ly = e.clientY; }
});
cv.addEventListener('pointermove', e => {
  if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId, {x: e.clientX, y: e.clientY});
  if (ptrs.size === 2 && sim.wheel) { const d = pdist(); setParam(sim.wheel.key, params[sim.wheel.key] + 3*Math.log10(d/pinch0)); pinch0 = d; }
  else if (dragging) { sim.onDrag(state, params, e.clientX - lx, e.clientY - ly, e); lx = e.clientX; ly = e.clientY; }
});
cv.addEventListener('contextmenu', e => { if (sim.draggable && sim.draggable(params, state)) e.preventDefault(); });   // right-drag is used to move the view
const endPtr = e => { ptrs.delete(e.pointerId); dragging = false; };
cv.addEventListener('pointerup', e => {
  if (down && ptrs.size === 1 && sim.onClick && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 6) {
    const b = cv.getBoundingClientRect(); sim.onClick(state, params, e.clientX - b.left, e.clientY - b.top);
  }
  down = null; endPtr(e);
}); cv.addEventListener('pointercancel', endPtr);
cv.addEventListener('wheel', e => {
  if (!sim.wheel) return;
  e.preventDefault(); setParam(sim.wheel.key, params[sim.wheel.key] - e.deltaY*sim.wheel.rate);
}, {passive: false});
window.addEventListener('resize', resize);
fillKind(store.sim && SIMS[store.sim] ? kindOf(store.sim) : 'sim', store.sim);
resize(); load(simSel.value); requestAnimationFrame(t => { last = t; frame(t); });
</script>
