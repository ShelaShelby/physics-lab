<script>
/* ============ 1. SIMULATION REGISTRY ============
   A sim provides: params (sliders, optional group), init(p), step(s,p,dt),
   draw(ctx,s,p,w,h,css), info(s,p) for the on-canvas HUD, hint(p) for a
   small note under the sliders, and optional actions (extra buttons).  */
const SIMS = {};
/* --- Learn: the guides and timelines of each lab, in one list. The Learn tab and each lab's Learn card both read it. fn(state, params, setParam) runs on the lab that is open. --- */
const LEARN = {
  'Atom Lab': [
    {label: '❓ What am I even looking at?', title: 'What am I even looking at?', d: 'A plain-words guide to the atom on screen: what every part is, in each of the four pictures.', fn: (s, p, set) => lrnOpen('What am I even looking at?', b => lrnLook(b, p, set))},
    {label: '📏 Scale: how empty is an atom?', title: 'Scale · how empty is an atom?', d: 'Blow the nucleus up to a size you can picture, and step through powers of ten.', fn: (s, p, set) => lrnOpen('Scale · how empty is an atom?', b => lrnScale(b, p, set))},
    {label: '⚖ Weight: what does an atom weigh?', title: 'Weight · what does an atom weigh?', d: 'The weight of the parts, the missing mass, how many atoms are in a grain, and what is inside a proton.', fn: (s, p, set) => lrnOpen('Weight · what does an atom weigh?', b => lrnMass(b, p, set))},
    {label: '🕰 Timeline: how we pictured the atom', title: 'Timeline of the atom', d: 'How our picture of the atom changed in 2,400 years, and how we learned to see, split and move atoms.', fn: (s, p, set) => lrnOpen('Timeline of the atom', b => lrnTimeline(b, set))}
  ],
  'Spacetime Lab': [
    {label: '❓ What am I even looking at?', title: 'What am I even looking at?', d: 'A plain-words guide to the bending sheet: time and space, what the grid, dip, graph, colours, rings and marbles mean, what is to scale, and what is exact or simplified.', fn: (s, p, set) => lrnOpen('What am I even looking at?', b => lrnSpaceLook(b, p, set))}
  ],
  'Orbit Lab': [
    {label: '❓ What am I even looking at?', title: 'What am I even looking at?', d: 'A plain-words guide to the picture: the rings, colours, labels, scale bar, the stars and the far-away things.', fn: (s, p, set) => lrnOpen('What am I even looking at?', b => lrnOrbitLook(b, s, p, set)), top: true},
    {label: '🌍 Why do we have seasons?', title: 'Why do we have seasons?', d: 'It is not because Earth gets closer to the Sun. Jump to the real solstices and equinoxes, see day length and the Sun’s height in every part of the world, and how the other planets do.', fn: (s, p, set) => lrnOpen('Why do we have seasons?', b => lrnSeasons(b, s, p, set))},
    {label: '🕰 Timeline: how we understood the Solar System', title: 'Timeline of the Solar System', d: 'How people came to understand where we live, from watching wandering stars to sending probes past every planet.', fn: (s, p, set) => lrnOpen('Timeline of the Solar System', box => lrnTimeline(box, set, ORB_TL, 'How people came to understand where we live, from watching wandering stars to sending probes past every planet. Scroll through the steps. Some have a ▶ button that takes you there in the lab.'))}
  ]

/* --- Orbit: several planets around one star, in 2D or 3D (velocity Verlet) ---
   Planets are test particles: they feel the star, not each other. */
// Real-world scale: with the star at 1 Sun (GM = 100), 1 AU = 100^(1/3) sim units, one year = 2π sim seconds, and 1 sim speed unit = 6.416 km/s.
const AU = Math.cbrt(100), YEAR = 2*Math.PI, KMS = 29.78/Math.sqrt(100/AU), AU_KM = 149.6e6;
/* --- units (Physics Lab 8.5): metric or imperial, chosen in Settings. Every stored number stays metric; only the words on screen change. --- */
window.PL_UN = 'metric'; try { if (localStorage.getItem('plUnits') === 'imperial') PL_UN = 'imperial'; } catch (e) {}
const MI_KM = 0.621371192, imp = () => PL_UN === 'imperial';
const uInt = v => Math.round(v).toLocaleString('en');
const uLen = km => imp() ? uInt(km*MI_KM) + ' mi' : uInt(km) + ' km';                                   // whole km or miles
const uLenD = km => imp() ? (km*MI_KM >= 100 ? uInt(km*MI_KM) : +(km*MI_KM).toPrecision(3)) + ' mi' : km + ' km';   // a length as written (11.1 km -> 6.9 mi)
const uMil = mkm => imp() ? uInt(mkm*MI_KM) + ' million mi' : uInt(mkm) + ' million km';               // millions of km or miles
const uSpd = (kms, d = 1) => (imp() ? kms*MI_KM : kms).toFixed(d) + (imp() ? ' mi/s' : ' km/s');

      <p class="lrnP"><b>Not real on a new date:</b> where each moon is (they start at made-up places), and the Voyagers, which only show from 1990 when both were flying in straight lines.</p>`));
    Dl.push(sec('time', '⏱ What does Time speed mean?', `
      <p class="lrnP">The Time speed slider decides how fast the lab’s time runs. It is set to <b>${tfmt}</b> right now: that many days (or seconds) of lab time go by for every real second you watch.</p>
      <p class="lrnP">The planets need very different times for one lap: Mercury about 88 days, Earth one year, Neptune about 165 years. So a speed that shows the outer planets moving is far too fast for Mercury, and a speed that lets you watch a moon is far too slow for Neptune. The date at the top left counts the lab’s time. <b>☉ Reset to today</b> puts everything back where it is today.</p>`));
    Dl.push(sec('scale', '📏 What is to scale, and what is not', `
      <p class="lrnP"><b>To scale:</b> the distances, and the planets’ orbits. ${TRUEs ? 'With <b>True scale</b> on, the planets, moons and the Sun are also drawn at their real size next to those distances. That is why the Sun is only a small ball, and the planets are far too small to see when you look at the whole Solar System. If you zoom in a lot, you will see how big the empty spaces really are.' : `With <b>Easy to see</b> on, the planets are drawn bigger than they really are, and the Sun about <b>${Math.round(big)} times</b> too big, so you can find them. Their distances are still to scale.`}</p>
      <p class="lrnP"><b>Made up to be seen:</b> the colours of the orbits and dots, the tails of the comets (their real length changes, and they only grow near the Sun), and the moons’ orbits. Moons are so close to their planet that in a true picture they would hide inside it, so their orbits are drawn much wider than real until you zoom far in. The card of the moon says how many times too wide.</p>
      <p class="lrnP"><b>Stand-ins:</b> the belts are drawn with a few thousand dots. In reality the asteroid belt has millions of rocks wider than 1 km, and the Oort cloud is thought to hold trillions of icy bodies that nobody has seen directly.</p>
      <p class="lrnP"><b>Simplified:</b> in this lab each planet feels only the Sun’s pull, not the pull of the other planets. Over a few years that is very close to the real thing, but if you run time for centuries, the planets slowly drift away from where they would really be.</p>`));
    Dl.push(sec('bary', '⚖️ Why does the Sun wobble?', `
      <p class="lrnP">The planets do not really orbit the <i>centre of the Sun</i>. The Sun and everything around it circle their common balance point, the <b>barycentre</b>. Because the Sun is so heavy, that point is always very close to it, but it is not exactly at its centre.</p>
      <div class="lrnCard"><div class="lrnBig">Right now the balance point is about <b>${bd.toFixed(1)} Sun radii</b> from the Sun’s centre.</div><div class="lrnSm">Over the years it wanders from inside the Sun to about 2 Sun radii out. Most of the pull comes from Jupiter, the heaviest planet. The whole picture is drawn around the barycentre, so the Sun is the one that wobbles. Tap the <b>Barycentre</b> tile under Go to to look at it.</div></div>`));
    Dl.push(sec('comet', '☄️ What is a comet, and why the tails?', `
      <p class="lrnP">A comet is a ball of ice and dust, usually only a few kilometres across. Its orbit is a long, stretched ellipse. Far from the Sun it is frozen, dark and has no tail.</p>
      <p class="lrnP">Near the Sun, the ice turns to gas and blows off, and the comet grows a glowing cloud and <b>two tails</b>: a thin, straight <b>blue gas tail</b> and a wider, curved <b>yellow dust tail</b>. Both point <b>away from the Sun</b>, no matter which way the comet is moving. The push comes from sunlight and the solar wind, so on the way out a comet flies tail first.</p>
      <p class="lrnP">Halley’s Comet goes round the Sun backwards compared with the planets, and is back about every 76 years (next in 2061).</p>`));
    Dl.push(sec('move', '🧭 How do I move around?', `
      <p class="lrnP"><b>Zoom</b> with the scroll wheel, a pinch, or the Zoom slider. <b>Move the view</b> by dragging${D3 ? ' (in 3D, dragging turns the view; use the ✥ Drag button, or right-drag or Shift-drag, to move it instead)' : ''}. <b>Tap</b> anything for its facts card. The <b>Go to</b> tiles fly you to a planet, moon, comet or belt and keep your Time speed as you set it.</p>
      <p class="lrnP">Lost? <b>↺ Reset view</b> brings back the whole picture.</p>`));
    out.append(lrnJumpBar(Dl), ...Dl);
  }
  draw();
}
const ORB_EASY = {Venus: 0.8, Earth: 0.8, Mars: 0.6, Jupiter: 1.3, Saturn: 1.2};
function orbLook(name, km, set) { const s = state; orbGo(name, 0, set); if (s.sel != null) { s.follow = true; set('zoom', trueScale() ? zoomFor(km, 100) : (ORB_EASY[name] ?? 0.8)); } }      // fly to a planet (or comet) and keep it in the middle
function orbDate(ms, name, km) { return set => { jumpToDate(state, params, ms); orbLook(name, km, set); }; }      // jump to a real moment, then look at that world
function orbFar(key, ms) { return set => { if (ms) jumpToDate(state, params, ms); if (params.far === 'Off') set('far', 'On'); const f = farFind(state, 'far:' + key); if (!f) return; state.cardHidden = false; state.sel = 'far:' + key; state.follow = true; set('zoom', Math.max(-9, Math.min(5.5, Math.log10(13.6/(f.au*AU))))); }; }      // fly out to a far-away thing (the same zoom as its tile)
const ORB_TL = [
  {y: 'thousands of years ago', who: 'Babylonians, Egyptians, Greeks, Chinese, Maya and many others', t: 'Wandering stars', d: 'Everyone noticed that five bright “stars” slowly wander through the constellations while all the others stay put: Mercury, Venus, Mars, Jupiter and Saturn. The Greek word for wanderer is <i>planetes</i>. Ancient astronomers wrote down their positions for centuries and learned to predict them.', svg: '<circle cx="10" cy="14" r="1.6" fill="#9aa5b8"/><circle cx="24" cy="10" r="1.6" fill="#9aa5b8"/><circle cx="40" cy="16" r="1.6" fill="#9aa5b8"/><circle cx="16" cy="30" r="1.6" fill="#9aa5b8"/><circle cx="46" cy="34" r="1.6" fill="#9aa5b8"/><path d="M8 46 Q24 30 48 22" stroke="#d27a2a" stroke-width="1.5" fill="none" stroke-dasharray="2 3"/><circle cx="30" cy="34" r="3.5" fill="#d27a2a"/>'},
  {y: 'about 270–240 BC', who: 'Aristarchus and Eratosthenes, Greece', t: 'Sun in the middle, and the size of the Earth', d: 'Aristarchus argued that the Earth goes around the Sun, but almost nobody believed him. Eratosthenes measured how long the shadow of a stick was in two Egyptian cities on the same day, and worked out the size of the Earth. His answer was within a few percent of the real 40,000 km.', svg: '<circle cx="28" cy="28" r="14" fill="none" stroke="#4a8ad2" stroke-width="2"/><path d="M28 28 L28 8 M28 28 L44 40" stroke="#9aa5b8" stroke-width="1.5"/><circle cx="28" cy="10" r="2" fill="#f0b020"/>'},
  {y: 'about 150 AD', who: 'Claudius Ptolemy, Egypt', t: 'Earth in the middle', d: 'Ptolemy wrote the model that lasted 1,400 years: the Earth sits still in the centre, and each planet moves on a small circle (an epicycle) that rides on a bigger circle. It was complicated, but it predicted planet positions well enough for centuries.', svg: '<circle cx="28" cy="28" r="3.5" fill="#4a8ad2"/><circle cx="28" cy="28" r="14" fill="none" stroke="#7a86a0"/><circle cx="42" cy="28" r="6" fill="none" stroke="#d27a2a"/><circle cx="48" cy="28" r="2" fill="#d27a2a"/>'},
  {y: '1543', who: 'Nicolaus Copernicus, Poland', t: 'The Sun in the centre', d: 'Copernicus published a book that put the Sun in the middle and made the Earth one of the planets. It explained why planets seem to loop backwards in the sky: we overtake them on our faster, inner orbit. Many people still did not accept it for a hundred years.', svg: '<circle cx="28" cy="28" r="5" fill="#f0b020"/><circle cx="28" cy="28" r="12" fill="none" stroke="#7a86a0"/><circle cx="28" cy="28" r="20" fill="none" stroke="#7a86a0"/><circle cx="40" cy="28" r="2.6" fill="#4a8ad2"/>', lab: ['See the inner Solar System', function(set) { orbGo(null, 0.3, set); }]},
  {y: '1609–1619', who: 'Johannes Kepler, Germany (using Tycho Brahe’s data)', t: 'Orbits are ellipses', d: 'From years of Tycho’s precise observations of Mars, Kepler found three laws. Planets move on ellipses, not circles, with the Sun at one focus. They move faster when closer to the Sun. And a planet’s year squared is proportional to its distance cubed. Kepler could say how big the orbits were compared to each other, but not yet in kilometres.', svg: '<ellipse cx="28" cy="28" rx="22" ry="14" fill="none" stroke="#7a86a0"/><circle cx="16" cy="28" r="3.5" fill="#f0b020"/><circle cx="46" cy="27" r="2.6" fill="#d27a2a"/>', lab: ['Look at Mars’s orbit', function(set) { orbGo("Mars", 0.3, set); }]},
  {y: '1610', who: 'Galileo Galilei, Italy', t: 'The telescope changes everything', d: 'Galileo pointed a telescope at Jupiter and saw four small lights that changed places from night to night. They were moons going around Jupiter: proof that not everything goes around the Earth. He also saw that Venus has phases like the Moon, which only makes sense if Venus goes around the Sun.', svg: '<circle cx="28" cy="28" r="9" fill="#c9a06a"/><circle cx="10" cy="28" r="2" fill="#9aa5b8"/><circle cx="16" cy="28" r="2" fill="#9aa5b8"/><circle cx="42" cy="28" r="2" fill="#9aa5b8"/><circle cx="48" cy="28" r="2" fill="#9aa5b8"/>', lab: ['Watch Jupiter’s four big moons', function(set) { orbGo("Jupiter", 1.3, set, true); }]},
  {y: '1655–1659', who: 'Christiaan Huygens, Netherlands', t: 'Saturn’s ring', d: 'With a better telescope than Galileo’s, Huygens found Saturn’s biggest moon, Titan, in 1655. Fifty years earlier Galileo had seen odd “ears” on Saturn, and nobody could explain them. In 1659 Huygens did: Saturn is surrounded by a thin, flat ring that never touches the planet. The ring seems to vanish about every 15 years, when we see it edge-on.', svg: '<ellipse cx="28" cy="28" rx="23" ry="7" fill="none" stroke="#e8d4a8" stroke-width="3" transform="rotate(-18 28 28)"/><circle cx="28" cy="28" r="10" fill="#d8c28a"/>', lab: ['Look at Saturn’s rings', function(set) { orbLook('Saturn', 134000, set); }]},
  {y: '1672–1769', who: 'Cassini and Richer; then teams watching Venus cross the Sun', t: 'How far is the Sun?', d: 'Kepler gave the shape of the Solar System but not its size. Astronomers measured the direction of Mars from two far-apart places (1672), and later timed Venus crossing the face of the Sun from around the world (1761 and 1769). Result: the Sun is about 150 million km away. That distance is the AU used in this lab.', svg: '<circle cx="14" cy="28" r="5" fill="#f0b020"/><circle cx="44" cy="28" r="3.5" fill="#4a8ad2"/><path d="M19 28 L40 28" stroke="#9aa5b8" stroke-width="1.5" stroke-dasharray="3 3"/>'},
  {y: '1687', who: 'Isaac Newton, England', t: 'Gravity explains it all', d: 'Newton showed that the same force that makes an apple fall also keeps the Moon and planets in orbit. Gravity gets weaker with the square of the distance, and from that alone all three of Kepler’s laws follow. This is the law that moves everything in this lab.', svg: '<circle cx="28" cy="16" r="4" fill="#d24a4a"/><path d="M28 22 L28 42" stroke="#9aa5b8" stroke-width="2"/><path d="M23 38 L28 44 L33 38" stroke="#9aa5b8" stroke-width="2" fill="none"/><circle cx="28" cy="50" r="3" fill="#4a8ad2"/>'},
  {y: '1758', who: 'Edmond Halley, England, and astronomers who checked it', t: 'A comet comes back', d: 'Halley worked out with Newton’s gravity that a comet seen in 1531, 1607 and 1682 was one comet returning every 76 years. He predicted it would come back in 1758. He had died by then, but it appeared on schedule, and the comet carries his name. It is the first proof that Newton’s law works far beyond the planets.', svg: '<circle cx="16" cy="36" r="3.5" fill="#cfd8ea"/><path d="M19 34 Q34 22 50 12" stroke="#cfd8ea" stroke-width="3" fill="none" opacity=".6"/><path d="M19 37 Q36 28 52 22" stroke="#cfd8ea" stroke-width="1.5" fill="none" opacity=".5"/>'},
  {y: '1781–1846', who: 'William Herschel, England; Urbain Le Verrier, France; Johann Galle, Germany', t: 'Uranus and Neptune', d: 'Herschel spotted Uranus in 1781, the first planet found with a telescope. Uranus wandered slightly off its predicted path, so Le Verrier used Newton’s gravity to calculate where a hidden planet must be. Galle pointed his telescope there in 1846 and found Neptune within one degree of the prediction. A planet found with a pen and paper.', svg: '<circle cx="22" cy="28" r="7" fill="#4aa8c0"/><circle cx="40" cy="28" r="6" fill="#3a5ad8"/><path d="M30 12 L34 8 M32 14 L36 10" stroke="#7a86a0"/>', lab: ['Look at Neptune', function(set) { orbGo("Neptune", -1.2, set); }]},
  {y: '1801', who: 'Giuseppe Piazzi, Italy', t: 'Ceres, the first asteroid', d: 'Piazzi found a new “planet” exactly in the gap between Mars and Jupiter where astronomers thought one was missing. But Ceres was tiny. More and more little worlds turned up nearby, and Ceres was renamed an asteroid, and today a dwarf planet. This is the asteroid belt.', svg: '<circle cx="28" cy="28" r="6" fill="#9a9a94"/><circle cx="12" cy="20" r="1.8" fill="#7a7a74"/><circle cx="44" cy="18" r="1.8" fill="#7a7a74"/><circle cx="46" cy="38" r="1.8" fill="#7a7a74"/><circle cx="14" cy="40" r="1.8" fill="#7a7a74"/>', lab: ['Look at Ceres', function(set) { orbGo("Ceres", 0.1, set); }]},
  {y: '1918', who: 'Harlow Shapley, USA', t: 'The Sun is not in the middle of the galaxy', d: 'Shapley mapped the globular clusters, big round balls of very old stars, and saw that they all sit around one far-off spot in the constellation Sagittarius, not around us. The centre of the Milky Way had to be there. He put it about 30,000 light years from the Sun. Today’s best measurement is about 27,000, so he was close. The Sun is an ordinary star in the suburbs of the galaxy.', svg: '<ellipse cx="28" cy="28" rx="25" ry="9" fill="#cfd8ea" opacity=".2"/><circle cx="22" cy="27" r="1.5" fill="#8fd0ff"/><circle cx="18" cy="31" r="1.5" fill="#8fd0ff"/><circle cx="24" cy="23" r="1.5" fill="#8fd0ff"/><circle cx="14" cy="26" r="1.5" fill="#8fd0ff"/><circle cx="20" cy="27" r="3" fill="#000" stroke="#fff"/><circle cx="46" cy="29" r="2.2" fill="#f0b020"/>', lab: ['Fly to the centre of the galaxy', orbFar('sgra')]},
  {y: '1930–2006', who: 'Clyde Tombaugh, USA; the International Astronomical Union', t: 'Pluto, and then not a planet', d: 'Tombaugh found Pluto in 1930 and it was called the ninth planet. But in the 1990s we found that Pluto is just one of many icy bodies past Neptune, and in 2005 Eris was found, about the same size. In 2006 astronomers created a new class, dwarf planets, and Pluto joined it.', svg: '<circle cx="28" cy="28" r="8" fill="#c9a88a"/><circle cx="40" cy="20" r="2.4" fill="#9a9a94"/><path d="M8 40 Q28 50 50 36" stroke="#7a86a0" stroke-dasharray="2 3" fill="none"/>', lab: ['Look at Pluto', function(set) { orbGo("Pluto", -1.2, set); }]},
  {y: '1957–1969', who: 'Soviet Union and USA', t: 'The Space Age', d: 'Sputnik was the first artificial satellite in 1957. Yuri Gagarin was the first human in space in 1961, and Mariner 2 flew past Venus in 1962, the first successful visit to another planet. In 1969, Apollo 11 put people on the Moon.', svg: '<circle cx="28" cy="28" r="9" fill="#4a8ad2"/><ellipse cx="28" cy="28" rx="20" ry="8" fill="none" stroke="#9aa5b8" transform="rotate(-25 28 28)"/><circle cx="46" cy="20" r="2.2" fill="#fff"/>'},
  {y: '1970–1976', who: 'Soviet Union’s Venera 7; NASA’s Viking 1', t: 'Landing on Venus and Mars', d: 'Venera 7 landed on Venus on 15 December 1970, the first spacecraft to land on another planet and send data back from its surface. It measured about 475 °C, and it lasted only a short while in that heat and crushing air. On 20 July 1976 Viking 1 became the first Mars lander to work properly. It kept going for more than six years, took photos, measured the weather, and ran experiments that searched the soil for signs of life. The answers were unclear.', svg: '<circle cx="18" cy="28" r="11" fill="#d9a441"/><circle cx="42" cy="28" r="8" fill="#d0553a"/><path d="M18 39 L18 45 M14 45 L22 45" stroke="#fff" stroke-width="1.6"/><path d="M42 36 L42 42 M38 42 L46 42" stroke="#fff" stroke-width="1.6"/>', lab: ['Jump to the day Viking 1 landed', orbDate(Date.UTC(1976, 6, 20, 11, 53), 'Mars', 3396)]},
  {y: '1977–1989', who: 'NASA, USA', t: 'Voyager’s Grand Tour', d: 'Voyager 1 and 2 launched in 1977, in a year when Jupiter, Saturn, Uranus and Neptune lined up, which happens about once every 175 years. Voyager 2 used gravity assists to fly past Jupiter (1979), Saturn (1981), Uranus (1986) and Neptune (1989). It is still the only spacecraft that has visited Uranus and Neptune.', svg: '<circle cx="10" cy="44" r="3" fill="#4a8ad2"/><circle cx="22" cy="22" r="4.5" fill="#c9a06a"/><circle cx="36" cy="30" r="3.5" fill="#d8c07a"/><circle cx="48" cy="14" r="3" fill="#3a5ad8"/><path d="M10 44 Q16 22 22 22 Q30 24 36 30 Q44 22 48 14" stroke="#e0b020" stroke-width="1.5" fill="none"/>', lab: ['Try the slingshot game', function(set) { showKind("game"); }]},
  {y: '1992', who: 'David Jewitt and Jane Luu, USA', t: 'The Kuiper belt', d: 'Astronomers had guessed for decades that a belt of icy bodies lay beyond Neptune. In 1992 Jewitt and Luu found the first one. Now over a thousand are known, and Pluto turns out to be one of the largest of them.', svg: '<circle cx="28" cy="28" r="3" fill="#f0b020"/><circle cx="28" cy="28" r="22" fill="none" stroke="#7a86a0" stroke-dasharray="1 3"/><circle cx="10" cy="20" r="1.6" fill="#9aa5b8"/><circle cx="44" cy="12" r="1.6" fill="#9aa5b8"/><circle cx="50" cy="34" r="1.6" fill="#9aa5b8"/><circle cx="24" cy="50" r="1.6" fill="#9aa5b8"/>', lab: ['Look at the Kuiper belt', function(set) { orbGo(null, -1.5, set); }]},
  {y: '1994', who: 'Carolyn and Eugene Shoemaker and David Levy, USA and Canada; astronomers everywhere', t: 'A comet hits Jupiter', d: 'Comet Shoemaker–Levy 9 was found in March 1993 already torn into a “string of pearls” of more than 20 pieces, after passing close to Jupiter in 1992. Between 16 and 22 July 1994, 21 of the pieces crashed into Jupiter one after another. It was the first time people saw two bodies in the Solar System collide. The biggest left a dark scar nearly as wide as the whole Earth.', svg: '<circle cx="40" cy="32" r="12" fill="#c9a06a"/><circle cx="6" cy="8" r="1.4" fill="#cfd8ea"/><circle cx="12" cy="13" r="1.7" fill="#cfd8ea"/><circle cx="18" cy="18" r="2" fill="#cfd8ea"/><circle cx="24" cy="23" r="2.2" fill="#cfd8ea"/><circle cx="30" cy="28" r="2.4" fill="#cfd8ea"/>', lab: ['Jump to the first impact, 16 July 1994', orbDate(Date.UTC(1994, 6, 16, 20, 0), 'Jupiter', 69911)]},
  {y: '1995', who: 'Michel Mayor and Didier Queloz, Switzerland', t: 'Other suns have planets', d: 'The first planet around a Sun-like star, 51 Pegasi b, was found in 1995. It was a giant planet closer to its star than Mercury is to ours. Since then thousands more have been found, and the Solar System turned out to be just one kind of planetary system. Mayor and Queloz won the 2019 Nobel Prize in Physics.', svg: '<circle cx="16" cy="28" r="7" fill="#f0b020"/><circle cx="40" cy="28" r="4" fill="#c9a06a"/><circle cx="16" cy="28" r="18" fill="none" stroke="#7a86a0" stroke-dasharray="2 3" opacity=".6"/>'},
  {y: '2004–2005', who: 'NASA and ESA, USA and Europe', t: 'Landing on Titan', d: 'The Cassini spacecraft reached Saturn in 2004, and in January 2005 the Huygens probe parachuted down onto Titan, Saturn’s largest moon. It was the first landing in the outer Solar System. Titan has clouds, rivers and lakes, but of methane, not water.', svg: '<circle cx="22" cy="28" r="9" fill="#d8c07a"/><ellipse cx="22" cy="28" rx="16" ry="4" fill="none" stroke="#d8c07a" opacity=".7"/><circle cx="44" cy="20" r="3.5" fill="#d27a2a"/>', lab: ['Look at Saturn and Titan', function(set) { orbGo("Saturn", 1.2, set, true); }]},
  {y: '2012', who: 'NASA’s Voyager 1', t: 'Leaving the Sun’s wind', d: 'On 25 August 2012 Voyager 1 passed the heliopause, the edge of the bubble blown by the Sun’s wind, 121 AU from the Sun. It was the first spacecraft to enter interstellar space, though NASA only confirmed it in September 2013. Voyager 2 followed in 2018, at 119 AU.', svg: '<circle cx="20" cy="36" r="16" fill="none" stroke="#9aa5b8" stroke-dasharray="3 3"/><circle cx="20" cy="36" r="3" fill="#f0b020"/><path d="M26 31 L45 15" stroke="#ffd27a" stroke-dasharray="2 2"/><circle cx="47" cy="13" r="2.4" fill="#fff"/><circle cx="47" cy="13" r="5.5" fill="none" stroke="#ffd27a"/>', lab: ['Jump to that day and fly out to Voyager 1', orbFar('v1', Date.UTC(2012, 7, 25))]},
  {y: '2014–2015', who: 'ESA’s Rosetta and Philae; NASA’s Dawn', t: 'Landing on a comet, and orbiting Ceres', d: 'On 12 November 2014 Rosetta’s small lander Philae touched down on comet 67P/Churyumov–Gerasimenko, the first landing on a comet. It bounced twice and came to rest in the shade, so its battery ran out after about three days. In March 2015 Dawn arrived at Ceres, the first spacecraft to orbit a dwarf planet, and the first ever to orbit two different worlds, since it had already circled the asteroid Vesta. Ceres has bright spots in a crater called Occator.', svg: '<circle cx="16" cy="38" r="5" fill="#9a9a94"/><path d="M12 35 Q4 26 2 18" stroke="#cfd8ea" stroke-width="2" fill="none" opacity=".6"/><circle cx="40" cy="20" r="10" fill="#8a8a86"/><circle cx="43" cy="18" r="1.7" fill="#fff"/><circle cx="38" cy="23" r="1.3" fill="#fff"/>', lab: ['Jump to Philae’s landing day', orbDate(Date.UTC(2014, 10, 12, 15, 33), '67P', 2)]},
  {y: '2015', who: 'NASA’s New Horizons, USA', t: 'Pluto up close', d: 'After nine years on its way, New Horizons flew past Pluto at 14 km/s on 14 July 2015. Pluto turned out to have mountains of ice, a huge heart-shaped plain, and thin blue haze. It kept going and passed a Kuiper belt rock named Arrokoth in 2019.', svg: '<circle cx="28" cy="28" r="12" fill="#c9a88a"/><path d="M22 24 Q28 18 34 24 Q28 36 22 24 Z" fill="#efe0d0"/>'},
  {y: '2017', who: 'Pan-STARRS telescope, Hawaii', t: 'A visitor from another star', d: 'ʻOumuamua was the first object ever seen passing through the Solar System from interstellar space. It moved too fast for the Sun to hold it, and its path was not a closed ellipse. A second one, the comet Borisov, was found in 2019.', svg: '<path d="M6 46 Q30 30 52 8" stroke="#e0b020" stroke-width="2" fill="none"/><circle cx="30" cy="28" r="3" fill="#e0b020"/><circle cx="12" cy="12" r="4" fill="#f0b020"/>'},
  {y: '2018–2021', who: 'NASA’s Parker Solar Probe, USA', t: 'Touching the Sun', d: 'Parker launched on 12 August 2018 to go closer to the Sun than any spacecraft before. On 28 April 2021 it flew into the corona, the Sun’s thin outer atmosphere, the first spacecraft to do so (announced that December). On 24 December 2024 it passed about 6.2 million km above the Sun’s surface at about 690,000 km/h, the fastest any human-made object has ever travelled. Its path is not drawn in the lab.', svg: '<circle cx="14" cy="42" r="18" fill="#f0b020"/><path d="M40 18 Q30 28 25 38" stroke="#fff" stroke-dasharray="2 2" fill="none"/><circle cx="41" cy="17" r="2.4" fill="#fff"/>', lab: ['Look at the Sun', function(set) { state.sel = 'star'; state.follow = true; state.cardHidden = false; set('zoom', trueScale() ? zoomFor(696000, 90) : 0.8); }]},

/* --- "Why do we have seasons?" (Orbit Lab 7.5): a plain-words guide with live numbers from the lab's own Earth.
   Checked against: NASA's Earth facts (the axis is tilted 23.4° and that tilt, not distance, causes the seasons); Wikipedia, Apsis (Earth's closest and farthest distance, and their 2026 dates);
   Wikipedia, Solstice (the 2026 equinox and solstice times); the IAU report for every planet's axis (the same numbers as the spinning planets). --- */
const SEAS_MOMENTS = [['March equinox', '20 Mar 2026', Date.UTC(2026, 2, 20, 14, 46)], ['June solstice', '21 Jun 2026', Date.UTC(2026, 5, 21, 8, 25)], ['September equinox', '23 Sep 2026', Date.UTC(2026, 8, 23, 0, 6)], ['December solstice', '21 Dec 2026', Date.UTC(2026, 11, 21, 20, 50)]];

function lrnSeasons(box, s, p, set) {
  const P = (html, cls) => lrnEl('p', 'lrnP' + (cls ? ' ' + cls : ''), html), live = lrnEl('div', 'lrnOut'), chips = lrnEl('div', 'lrnChips'), pl = lrnEl('div', 'lrnOut');
  box.append(
    P('<b>It is not because Earth gets closer to the Sun.</b> Earth is closest to the Sun in early January and farthest in early July: in 2026 on 3 January (147.1 million km, 0.983 AU) and on 6 July (152.1 million km, 1.017 AU). Yet January is winter in the north. The real cause is a lean.'),
    P('<b>The lean.</b> Earth turns around an axis that leans 23.4° from straight up (straight up means at a right angle to its path round the Sun). All year the axis keeps pointing the same way in space, while Earth goes round the Sun. So in June the north end leans toward the Sun, and in December it leans away. In March and September it leans sideways, and both halves get the same.'),
    lrnEl('div', 'lrnOut', `<svg viewBox="0 0 240 190" width="100%" style="max-width:340px;display:block;margin:0 auto" role="img" aria-label="Earth's four places on its orbit, seen from above, with the axis always leaning the same way">
      <ellipse cx="120" cy="100" rx="82" ry="72" fill="none" stroke="currentColor" opacity=".3" stroke-dasharray="3 4"/>
      <circle cx="120" cy="100" r="11" fill="#f0b020"/>
      ${[['Dec', 120, 28], ['Mar', 38, 100], ['Jun', 120, 172], ['Sep', 202, 100]].map(([n, x, y]) => `<circle cx="${x}" cy="${y}" r="9" fill="#2f6fed"/><path d="M${x} ${y} L${x} ${y - 21}" stroke="currentColor" stroke-width="2"/><circle cx="${x}" cy="${y - 21}" r="2.2" fill="currentColor"/><text x="${n === 'Sep' ? x - 13 : n === 'Mar' ? x + 13 : x + 14}" y="${n === 'Dec' ? y + 4 : n === 'Jun' ? y + 4 : y + 20}" font-size="11" fill="currentColor" text-anchor="${n === 'Mar' ? 'start' : n === 'Sep' ? 'end' : 'start'}">${n}</text>`).join('')}</svg>`),
    P('Drawn from above, the axis looks short because it leans out of the page. Earth is at the bottom in June, and there the axis leans up toward the Sun. At the top in December it leans away from it.', 'lrnMuted'),
    P('<b>Why leaning matters.</b> Two things change with the season. The days get longer, so the ground has more hours to warm up. And the Sun climbs higher in the sky, so its light hits the ground more straight on and the same sunshine is spread over less ground. Both happen at once. Below, the lab’s own Earth and Sun give the numbers. Tap a real moment to jump the lab to it.'),
    chips, live,
    P('<b>Where the Sun can be overhead.</b> Only between 23.4° north and 23.4° south (the tropics). Beyond 66.6° (that is 90° minus 23.4°) the Sun can stay above the horizon all day, the midnight sun, or below it all day. The equator hardly has seasons, because the days are about 12 hours all year.'),
    P('<b>North and south are opposite.</b> When the north leans toward the Sun, the south leans away: summer in the north means winter in the south, and Christmas in Australia is in summer.'),
    P('<b>So does distance matter at all?</b> A little. By the inverse-square law Earth gets about 7% more sunlight in January than in July, which is tiny next to what the lean does (see how the noon Sun changes in the table).'),
    P('<b>Seasons on other planets.</b> It all depends on the lean, measured live from each planet’s real axis (the IAU numbers behind the spinning planets):'), pl,

    { const b = lrnEl('button', '', 'Today'); b.type = 'button'; b.onclick = () => { if (S.todayMs) jumpToDate(S, params, S.todayMs); draw(); }; chips.appendChild(b); }

      }).join('');

    }
    const PN = {Mercury: t => 'Almost upright: almost no seasons', Venus: t => `Upside down (it turns backwards), but only ${(180 - t).toFixed(1)}° from upright the other way: hardly any seasons`, Earth: t => 'Four seasons, each about 3 months', Mars: t => 'Four seasons like Earth’s, each nearly twice as long (a Mars year is 687 days), and lopsided because its orbit is quite oval',
      Jupiter: t => 'Almost upright: hardly any seasons', Saturn: t => 'Seasons like Earth’s, each over 7 years (a Saturn year is 29.5 Earth years)', Uranus: t => 'Extreme: it rolls on its side, so each pole gets about 42 years of sunlight, then about 42 of darkness', Neptune: t => 'Seasons like Earth’s, each about 41 years (a Neptune year is 165 Earth years)'};
    pl.innerHTML = S.epochMs ? `<div class="lrnTabW"><table class="lrnTab"><tr><th>Planet</th><th class="n">Lean</th><th>Seasons</th></tr>${Object.keys(PN).map(nm => { const b = S.bodies.find(x => x.name === nm); return b ? `<tr><td>${nm}</td><td class="n">${axisTilt(b, S).toFixed(1)}°</td><td>${PN[nm](axisTilt(b, S))}</td></tr>` : ''; }).join('')}</table></div>` : '';
  }

const HL = '#ff2bd6';                                          // colour of the "look here" mark in Orbit Lab: nothing else in the picture is this pink
function circWin(x, y, r) {                                     // a circle far bigger than the picture: 'in' (picture is inside it), 'out' (picture misses it) or the little stretch of angles that can be seen

SIMS['Orbit Lab'] = {
  update: '7.7.2',
  changelog: [
    ['7.7.2', 'Slower Journey', 'The 🚀 Journey stayed on each stop for the same 3.4 seconds however long the text was, so the longer ones went past before you could read them. Each stop now stays as long as its text needs (about 2 seconds plus one second for every 18 letters, so 7 to 13 seconds), and the zoom between stops is about a third slower.'],
    ['7.7.1', 'Lighter drawing', 'The orbit trails are drawn with less work: the part that trims each line to the screen now skips lines that are fully on screen and no longer makes throwaway lists. About 10 % less work per frame with 3D, full trails and the sky switched on. The picture is exactly the same, pixel for pixel.'],
    ['7.7', 'Faster at high time speed', 'At the fastest time speeds the orbits are worked out in far less time, so the picture stays smooth on phones. Each small time step used to work out the Sun’s pull on every body twice; the pull at the end of one step is the same as at the start of the next, so it is now worked out once and reused. The physics is unchanged: the same method (leapfrog), the same step size and the same orbits.'],
    ['7.6', 'Help guide on one page, with a jump bar', 'The “What am I even looking at?” guide is now one long page instead of dropdown boxes: every section is open, the headings stay as headings, and a row of tappable headings at the top jumps you to any section. Each heading also has a small ↑ that takes you back to that row. The text itself is unchanged.'],
    ['7.5.1', 'The Sun is called the Sun', 'The label on the star now says “Sun · 1 solar mass (M☉)” instead of “Star · 1.00 Sun”, and its info box is titled “Sun · G-type star” and gives its mass in solar masses (M☉), the unit astronomers use: one solar mass is the mass of the Sun, 1.99×10³⁰ kg.'],
    ['7.5', 'Eight new timeline steps and “Why do we have seasons?”', 'The Solar System timeline has eight new steps: Huygens and Saturn’s ring (1655–1659), Shapley showing the Sun is not at the centre of the galaxy (1918), landing on Venus and Mars (1970–1976), Comet Shoemaker–Levy 9 hitting Jupiter (1994), Voyager 1 leaving the Sun’s wind (2012), Philae landing on a comet and Dawn orbiting Ceres (2014–2015), Parker Solar Probe touching the Sun (2018–2021) and the 2020 Nobel Prize for weighing the black hole at the centre of our galaxy. Most have a ▶ button that flies to the place or jumps to the day. There is also a new guide in Learn, 🌍 Why do we have seasons?: the tilt of Earth’s axis, a diagram, and live numbers from the lab’s own Earth (jump to the real 2026 equinoxes and solstices and see day length and the noon Sun height from pole to pole), and how the tilt of each planet gives it seasons or none.'],
    ['7.4.1', 'Smoother zooming', 'Zooming in and out of planets and the Sun dropped the frame rate in a few places. Fixed: (1) the round picture of a planet used to be rebuilt every few pixels while you zoomed; now it uses a few set sizes, borrows a nearby size while you are zooming, and builds the sharp one a moment after you stop. (2) A plain planet’s colour and shading are now painted in one go instead of two full-size fills. (3) The Sun’s glowing patches that are off the picture are skipped. (4) The date in the corner is only re-made once a day instead of every frame. Nothing looks different once it settles. Also new: clicking the galactic centre gives the Galactic Center achievement.'],
    ['7.4', 'The Sun really spins, seasons, galactic centre', 'The Sun now turns the way the real one does: its axis is tilted 7.3° from upright (the IAU value for its north pole) and it turns once in 25.4 days, the standard rate. Its surface is gas, so the real equator turns faster (about 25 days) than the poles (about 34): the card says so. The glowing patches on it are decoration, but they turn with the real axis and rate. Earth’s card now says which season it is (north and south), how long ago it began and when the next starts, and where on Earth the Sun is straight overhead, all worked out from the real tilt and Earth’s place on its orbit. The black hole at the centre of our galaxy is now labelled Galactic centre when you zoom out to it.'],
    ['7.3', 'Info box smaller on phones', 'On a phone the facts box still took up too much of the picture, because the picture is narrow and the text was the same size as on a big screen. The box now shrinks with the width of the picture: full size on a computer, about 25% smaller on a phone.'],
    ['7.2', 'Smoother when zoomed in on a planet', 'Zooming in on a planet and turning it (or turning the 3D view) made the frame rate drop, because the picture of the spinning planet was worked out pixel by pixel every frame at full size. It is now much cheaper: the maths per pixel is faster, and while the planet or the view is moving a smaller picture is drawn (smooth), and a moment after it stops the sharp one is drawn. It looks the same once it settles.'],
    ['7.1', 'Smaller info box, safer first tap', 'The facts box on the picture is now smaller and more compact (smaller text, tighter lines, and see-through), so the planet or object you are looking at stays visible. Its last line now says “tap anywhere to close this box”. And the first tap now only closes the box: before, tapping the picture while zoomed in close at a fast Time speed also let go of the planet and the view flew away. A second tap selects or lets go as before, and tapping a Go to tile or the Follow button works as always.'],
    ['7', 'Spinning planets, Journey and Jump to a date', 'The planets now really spin. Each one turns at its real speed and leans the real way, from the IAU’s rotation data: Earth’s axis leans 23.4°, Uranus lies on its side (97.8°), Venus is upside down (177.4°) and turns backwards, and Saturn’s rings now tilt with its axis. A dashed line shows each planet’s axis, with N at the end it turns counter-clockwise around. Earth shows its real coastlines turned the way Earth really is on the date shown; the other planets are plain-coloured with a grid of latitude and longitude and one bright 0° meridian, so their turning can be seen. Pick a planet and tap ⏱ Slow time to watch it turn (one turn takes about 24 seconds). At fast Time speeds a planet would turn too fast to see, so it is held still. The planet cards now say how long one turn takes and how far the axis leans. A new Journey and dates card has two things. 🚀 Journey zooms out by itself from Earth and the Moon past the planets, Voyager 1, the Oort cloud and the nearest stars to the centre of our galaxy, with a short caption at each stop; touching anything stops it. Jump to a date: pick any date from 1800 to 2100 (Greenwich time) and every planet, dwarf planet, comet and belt moves to where it really was or will be (NASA/JPL orbit numbers for 1800–2050, a little less exact after that). It matches famous days: Mars is 55.8 million km away on 27 Aug 2003, and Jupiter and Saturn are 0.1° apart on 21 Dec 2020. Tiles jump to Halley at its closest (1986) and back (2061), Neptune’s discovery (1846), the 2012 transit of Venus, the 2020 great conjunction and Today. On a new date the moons start at made-up places, and the Voyagers show only from 1990. Also fixed: the 3D view was upside down (the north pole of the Solar System pointed down the screen, so Earth’s North Pole would have too). It is now the right way up, which turns the default 3D picture a half-turn. The date at the top left is now in Greenwich time.'],
    ['6.1', 'Easier to read', 'The new night sky was drowning the planets, so: the stars are now dim up close and get brighter as you zoom out, where the sky is the point (the Stars setting is Soft by default, with Full for the old strength). Planet, comet and ring labels now have a thin dark edge so they stay readable on top of stars. The Voyagers no longer cross the planets at the normal view: they only appear once you zoom out past about ×0.03, or when you pick one. And when you are zoomed far out, a short line at the bottom left says how wide the picture is and that the whole Solar System is now the ringed dot in the middle.'],
    ['6', 'Real stars and far-away things', 'Space is no longer empty. Behind the planets there is now the real night sky: the 2,874 brightest stars at their true directions and true colours (Sirius, Betelgeuse, the Pleiades’ neighbours and all the rest), with a soft band for the plane of the Milky Way. The sky is so far away that it does not move when you zoom, only when you turn the 3D view. A new Constellations setting draws the constellation lines and, if you want, their names and the brightest stars’ names. Zoom out much further (now to ×0.000000001) and the real far-away things appear at their true direction and distance: the nearest stars (Alpha Centauri at 4.3 light years, Barnard’s Star, Sirius, Vega and more), the Pleiades, the Orion Nebula and Sagittarius A*, the black hole at the centre of our galaxy, 27,000 light years away. Voyager 1 and Voyager 2 are there too, at their real place on 30 Sep 2026, moving at their real speeds as time runs, with the spot where each left the Sun’s wind marked. Click any of them for facts, including how long Voyager 1 would need to get there. The distance rings now count in light years as well, and new Go to tiles fly you to them. The picture now has a dark space background.'],
    ['5.6', 'View fixes and short tails', 'Letting go, going to belts, Ceres and deep zoom, plus short tails. Tapping the tile you are on again (or the Follow button) now only removes the pink ring and stops following; the picture stays exactly where it was, where before in 3D it could shift to a different spot. Going to the asteroid belt, any belt or the Oort cloud used to leave 3D looking closer or further away depending on what you had looked at before; every Go to now starts from a clean view. The lag around Ceres at the 500 to 2,000 km scale came from the thin dotted line that drops from a planet down to the flat plane (millions of pixels long, drawn as millions of tiny dashes) and the faint green habitable zone band (billions of pixels wide); both are now drawn only where you can see them, and planets fully off the picture are skipped. Zooming far into a planet, and out from the asteroid belt, is lighter on the graphics card: the planet, its pink ring, its moons’ orbits and its trail are drawn only where you can see them, and each belt is drawn in one go. Every planet, dwarf planet and comet now has a short tail behind it instead of a trail that grows over many laps, and a new Trails setting in the View card switches between “Short tail” (the default) and “Full orbit trails”. It all looks the same, only smoother.'],
    ['5.5', 'What am I even looking at?', 'A new ❓ button at the top opens a plain-words guide to the picture, in tap-to-open sections: what each ring, dot, line and coloured ball means, the pink ring, what Time speed means, what is to scale and what is only made to be seen, why the Sun wobbles (the barycentre), and comets and their tails. The text follows your 2D/3D and True scale / Easy to see choice, and shows live facts about the date and the thing you have selected.'],
    ['5.1', 'Comets stay on their line, smooth zoom near the Sun', 'Fixed a big slowdown: zoomed in close to the Sun, the comets’ dotted orbits stretched millions of pixels off screen and the app drew all of it every frame. Now only the part you can see is drawn, and the frame rate stays high everywhere. When you zoomed far in on a comet, its dotted orbit was drawn as straight pieces that were far too long, so the comet slid off the line and seemed to bounce at fast Time speeds. The orbit is now drawn with points packed tightly around the comet itself, so it sits exactly on the line at every zoom (checked on all six comets: 0 pixels off, before it was up to thousands).'],
    ['5', 'Scale bar and famous comets', 'A scale bar at the bottom left of the picture shows how long a round distance is at this zoom (in km, million km or AU) and how long light takes to cross it: 8.3 minutes for 1 AU, about 1.3 seconds for the Moon’s orbit. Six famous comets have arrived: Halley, Hale–Bopp, NEOWISE, Encke, 67P (Rosetta) and Swift–Tuttle. Each follows its real orbit (dotted line), sits where it really is today, and grows a glowing head and two tails once the Sun warms it: a straight blue gas tail and a curved yellow dust tail, both pointing away from the Sun. Their cards give the last and next closest approach. There is a new Comets section in Go to and a Famous comets switch under Solar System extras. Comet orbits are drawn from NASA/JPL data; Jupiter nudges them, so real passage dates can shift a little.'],
    ['4.6', 'Time speed up top', 'The Time speed slider is now the second card on the right, right under Reset to today, so you can change the speed without scrolling down past the Go to tiles.'],
    ['4.5', 'True scale, deeper zoom, real Earth', 'Planets, moons and the Sun are now drawn at their TRUE size. At the wide view they are still small dots so you can find them, but zoom in and they grow to their real size next to their real distances: the Sun is a small ball, Earth is tiny next to the Moon’s orbit, and the barycentre now sits just outside the Sun’s edge. The zoom now goes 4 times deeper (up to ×300,000), enough to fill the picture with Earth or Mercury. Go to tiles pick a zoom for you: a planet tile shows the planet up close, a moon tile shows that moon’s whole orbit, and the Sun tile shows the Sun. A new Sizes setting switches back to the old “Easy to see” sizes (planets drawn bigger, moon orbits drawn wider). Earth also has real continents now: green land, deserts, ice caps, clouds and a thin blue edge of air. In True scale there is no longer a minimum dot size: the Sun, planets and moons are exactly as big as they really are at every zoom. When one is smaller than a pixel (which is most of the time when zoomed out) a small ring marks where it is, so you can still find and tap it. The Easy to see setting keeps the old dots.'],
    ['4.1', 'Barycentre', 'A new Barycentre marker (a crosshair in a ring) and a Barycentre tile in the Go to card. The barycentre is the balance point of the Sun and all the planets, worked out from their real masses. The whole picture is now drawn around it, so the Sun is the one that wobbles, mostly because of Jupiter. Real barycentre sits from inside the Sun out to about 2 Sun radii. The marker is hidden at wide zoom, where it would sit on the Sun’s centre; use the Go to tile or zoom in on the Sun.'],
    ['4', 'Real-looking planets and Sun', 'Planets, moons and the Sun are lit balls (bright on the side facing the Sun, dark on the far side), with a glowing Sun that turns about once in 25 days and wobbles a little around the centre of the system. Stripes, continents, clouds, craters and sunspots were tried and taken away again, so each body is one smooth colour; Saturn keeps its rings passing in front of and behind it. The Sun’s black dots gave way to soft bright and orange patches of glowing gas that still turn with it. The Orbit Lab now starts at 1 s = 29 days instead of 291 days, so the inner planets no longer go crazy, and moons keep true time at every speed (only when a lap takes less than about eight frames is the moon’s whole orbit lit up instead of a dot, and its card says how many laps a second it does).'],
    ['3.1', 'Go to polish', 'Trails of far-away bodies (the dwarf planets most of all) used to stop a little short of the body and then jump forward every second or so; the line now always reaches the body, so it moves smoothly. The note at the top left now shows the date as time passes (for example 29 Sep 2126 after 100 years) and how long it has been since today, instead of the starting date only. Going to a planet, moon or belt no longer changes the time speed: it stays where you put it. The mouse wheel now zooms in smaller steps, so it is easy to stop on a far-away dwarf planet without moving the picture after every scroll. The ring that marks what you flew to is now bright pink with a dark edge, so it stands out from orange and beige planets. When you go to a belt or the Oort cloud, all of its rocks light up pink and get a bit bigger, and its name gets a pink tag, so you can see exactly which dots are the belt. Tap the tile you are on in the Go to card again and it lets go: the pink ring goes away and the picture stops following it. A little x y z compass now sits at the bottom right of the picture (above the info card when one is open). It turns as you turn the 3D view; in the flat view z points at you, so it is drawn as a dot.'],
    ['3', 'Go to table', 'A new Go to card with a tile for the Sun, every planet, the five dwarf planets, all fourteen moons, the asteroid belt, Jupiter’s Trojans, the Kuiper belt and the Oort cloud, coloured like the bodies themselves. Tap one to fly there: it gets selected and stays in the middle of the picture, and for planets with moons and for moons, time slows down so you can watch them. On a phone the picture scrolls into view. The tile of whatever you have selected is highlighted, also when you click it in the picture.'],
    ['2.5', 'Just the real Solar System, timeline and real time', 'The lab now opens on the real Solar System, with everything where it is today, and nothing else: the custom star, the Add / Remove planet buttons, the New planet launch controls and the Inner planets preset are gone. The one preset button is now ☉ Reset to today, which puts everything back where it is today and resets the view and time speed. New Learn card with a 21-step timeline: wandering stars, Aristarchus and Eratosthenes, Ptolemy, Copernicus, Kepler, Galileo, measuring the AU, Newton, Halley, Uranus and Neptune, Ceres, Pluto, the Space Age, Voyager, the Kuiper belt, the first exoplanet, Titan, New Horizons, ʻOumuamua, DART and the Oort cloud. Many steps have a ▶ button that takes the lab there (Jupiter’s moons, Mars’s orbit, Pluto, the Kuiper belt, the Oort cloud …). Time speed now goes all the way down to 1 s = 1 second (real time), from 1 s = 1 second up through minutes, hours, days and years. The timeline’s ▶ buttons no longer switch you from 3D to 2D: they keep the view you chose. In 3D, a planet’s moons could disappear at some viewing angles (Earth’s Moon and the moons of Mars, and Jupiter’s when zoomed out a bit further). Whether the moons are shown now depends only on how far you have zoomed in, not on the angle, so they stay put while you rotate.'],
    ['2', 'Real Solar System, moons, belts and dwarf planets', 'One click puts Mercury to Neptune where they really are today (NASA/JPL orbital elements), with real sizes, masses, gravity and temperatures. New time-speed slider and a much wider zoom-out. Fourteen real moons (Moon, Phobos, Deimos, the four Galilean moons, Titan, Rhea, Enceladus, Titania, Oberon, Triton, Charon), the asteroid belt with its gaps, Jupiter\'s Trojans, the Kuiper belt, and the dwarf planets Ceres, Pluto, Haumea, Makemake and Eris. Click any of them for facts. Zoom way out in the Real Solar System to reach the Oort cloud: a flattened inner part (2,000 – 20,000 AU) and a round outer part out to about 200,000 AU. Rings and labels now work at any zoom.'],
    ['1.5', 'Move the view and click for info', 'Drag to move the view (right-drag or Shift-drag in 3D). Click a planet or the star for size, mass, gravity, distance, speed, orbit, lap time and temperature. Follow button, habitable-zone band, coloured star, planet types.'],
    ['1', 'First version, 3D view and real units', 'A star with planets, name labels, add / remove planets, circular and escape speed readout, planets removed when they crash or escape. Each lab now shows its own update number. Click the Update badge to see this list. New 3D view: drag to rotate, orbits can be tilted, depth shown by size, drop lines and a ground grid. Zoom with scroll, pinch or the slider (also in 2D). Star mass in Suns, distance in AU (1 AU = Earth to Sun), speed in km/s, time in years. Labelled distance rings, a "Circular speed" button, and a live line saying what the launch will do (circle, ellipse or escape).'],
  ],

    const quiet = (key, val) => { const d = SIMS['Orbit Lab'].params.find(q => q.key === key); if (d.type !== 'select') val = Math.max(d.min, Math.min(d.max, val)); p[key] = val; const u = ui[key]; if (u && u.sel) u.sel.value = val; if (u && u.inp) { u.inp.value = val; u.out.textContent = d.fmt ? d.fmt(val) : val; } };
    loadSolar(s, p, quiet, 8); s.zoomPrev = p.zoom; return s; },           // the lab opens on the real Solar System

    {label:'◉ Follow', group:'View', visible: (p, s) => s.sel != null && !String(s.sel).startsWith('belt'), text: s => s.follow ? '◉ Following' : '○ Follow', fn(s) { s.follow = !s.follow; }},
    {label:'✥ Drag', group:'View', visible: p => p.view === '3D', text: s => s.panMode ? '✥ Drag moves the view' : '⟲ Drag rotates the view', fn(s) { s.panMode = !s.panMode; }},

    const go = ms => { const s = state; if (s.jny) jnyStop(s, params, set); if (ms == null) { loadSolar(s, params, set, 8); dSt.textContent = 'Back to today.'; return; }
      ms = jumpToDate(s, params, ms); dSt.textContent = `Showing ${s.epoch}. ` + (ms > Date.UTC(2050, 11, 31) ? 'After 2050 the planets’ places are extrapolated beyond NASA’s table (1800–2050), so they get slowly less exact. ' : '') + 'The moons start at made-up places (only the planets, dwarf planets, comets and belts are real).'; };
    dGo.onclick = () => { const ms = Date.parse(dIn.value + 'T' + (tIn.value || '12:00') + ':00Z'); if (isNaN(ms)) { dSt.textContent = 'Pick a date first.'; return; } go(ms); };

    const jtiles = document.createElement('div'); jtiles.className = 'gt'; jtiles.style.cssText = 'margin-top:8px;grid-template-columns:repeat(2,minmax(0,1fr))';

    jc.append(jtiles, dSt);

  {y: '1897', who: 'J. J. Thomson, England', t: 'The electron, and the "plum pudding"', d: 'Thomson found a particle about 1,800 times lighter than hydrogen: the electron. So atoms have parts! His model had negative electrons scattered inside a positive blob, like raisins in a pudding.', svg: '<circle cx="28" cy="28" r="20" fill="#f0c8c0"/><circle cx="20" cy="22" r="2.6" fill="#2a5db0"/><circle cx="34" cy="20" r="2.6" fill="#2a5db0"/><circle cx="26" cy="34" r="2.6" fill="#2a5db0"/><circle cx="37" cy="33" r="2.6" fill="#2a5db0"/><circle cx="19" cy="35" r="2.6" fill="#2a5db0"/>'},
  {y: '1905–1909', who: 'Albert Einstein, then Jean Perrin, France', t: 'Proof that atoms exist', d: 'Even in 1900 many famous scientists doubted that atoms were real. Einstein worked out that the jittery dance of tiny grains in water must come from invisible molecules bumping them. Perrin measured the jitter, and the numbers matched. The argument was over.', svg: '<path d="M8 40 L16 30 L22 38 L30 20 L36 34 L42 16 L48 28" stroke="#4a8ad2" stroke-width="2" fill="none"/><circle cx="30" cy="20" r="3" fill="#4a8ad2"/>'},
  {y: '1909–1911', who: 'Ernest Rutherford (with Geiger and Marsden), New Zealand and England', t: 'The nucleus', d: 'They fired particles at gold foil. Most went straight through, but about 1 in 8,000 bounced almost straight back. Rutherford: "as if you fired a shell at tissue paper and it came back." The positive charge must sit in a tiny, dense nucleus, and the rest of the atom is empty.', svg: '<circle cx="34" cy="28" r="3" fill="#d24a4a"/><path d="M4 18 L30 26" stroke="#7a86a0" stroke-width="1.5"/><path d="M4 30 L48 30" stroke="#7a86a0" stroke-width="1.5"/><path d="M4 40 L32 31 L18 8" stroke="#c85a2a" stroke-width="1.5" fill="none"/>', lab: ['See the tiny nucleus in the lab', {zoom: 3}]},
  {y: '1913', who: 'Niels Bohr, Denmark', t: 'Electrons on fixed orbits', d: 'Electrons circle the nucleus like planets, but only on certain allowed orbits. When one jumps down to a lower orbit, it gives out a photon of one exact colour. This explained the colours in hydrogen light for the first time.', svg: '<circle cx="28" cy="28" r="4" fill="#d24a4a"/><circle cx="28" cy="28" r="10" fill="none" stroke="#7a86a0"/><circle cx="28" cy="28" r="19" fill="none" stroke="#7a86a0"/><circle cx="38" cy="28" r="2.6" fill="#2a5db0"/>', lab: ['Watch Bohr\'s orbit and photon jumps', {view: 'Orbit', zoom: 0}]},
  {y: '1913', who: 'Henry Moseley, England', t: 'Atomic number = protons', d: 'Moseley measured the X-rays each element gives off and found a whole number for each one. That number is the number of protons in its nucleus. It put the periodic table in its true order and showed exactly which elements were still missing. He was killed in World War I at the age of 27.', svg: '<text x="28" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="#d24a4a" font-family="system-ui,sans-serif">Z</text><circle cx="28" cy="28" r="20" fill="none" stroke="#7a86a0" stroke-dasharray="2 3"/>'},
  {y: '1919', who: 'Ernest Rutherford, England', t: 'The proton, and the first changed atom', d: 'Rutherford shot fast particles into nitrogen gas and hydrogen nuclei came flying out. So the hydrogen nucleus, the proton, sits inside other atoms. It was also the first time anyone changed one element into another on purpose: nitrogen into oxygen.', svg: '<circle cx="28" cy="28" r="9" fill="#d24a4a"/><text x="28" y="33" text-anchor="middle" font-size="14" font-weight="700" fill="#fff" font-family="system-ui,sans-serif">+</text>', lab: ['Look at a single proton', {Z: 1, N: 0}]},
  {y: '1924–1927', who: 'Louis de Broglie, France; Davisson and Germer, USA', t: 'Matter is a wave too', d: 'de Broglie asked: if light can act like a particle, can a particle act like a wave? Three years later, electrons fired at a crystal made a wave pattern. Electrons really do behave like waves, which is what makes the electron cloud possible.', svg: '<path d="M6 28 Q13 10 20 28 T34 28 T48 28" stroke="#2a5db0" stroke-width="2.5" fill="none"/>'},
  {y: '1925', who: 'Wolfgang Pauli, Austria', t: 'Why electrons form shells', d: 'Pauli’s rule: no two electrons can be in exactly the same state. So electrons cannot all crowd into the lowest level. They fill shells one after another, and that is what creates the rows of the periodic table, and the different chemistry of each element.', svg: '<circle cx="28" cy="28" r="4" fill="#d24a4a"/><circle cx="28" cy="28" r="10" fill="none" stroke="#7a86a0"/><circle cx="28" cy="28" r="18" fill="none" stroke="#7a86a0"/><circle cx="38" cy="28" r="2.4" fill="#2a5db0"/><circle cx="18" cy="28" r="2.4" fill="#2a5db0"/><circle cx="46" cy="28" r="2.4" fill="#2a5db0"/><circle cx="10" cy="28" r="2.4" fill="#2a5db0"/><circle cx="28" cy="10" r="2.4" fill="#2a5db0"/>', lab: ['See neon in the lab', {Z: 10, N: 10, zoom: 0}]},
  {y: '1925–1926', who: 'Heisenberg, Schrödinger and Born, Germany and Austria', t: 'Electron clouds', d: 'Electrons behave like waves. You cannot say where the electron is, only where it is <i>likely</i> to be. The orbit becomes a cloud of probability. This model predicts almost everything about atoms, and it is the one the lab uses for the Cloud views.', svg: '<defs><radialGradient id="cg"><stop offset="0" stop-color="#2a5db0" stop-opacity=".9"/><stop offset="1" stop-color="#2a5db0" stop-opacity="0"/></radialGradient></defs><circle cx="28" cy="28" r="22" fill="url(#cg)"/><circle cx="28" cy="28" r="2.5" fill="#d24a4a"/>', lab: ['Open the electron cloud in 3D', {view: 'Cloud 3D', zoom: 0}]},
  {y: '1932', who: 'James Chadwick, England', t: 'The neutron', d: 'The nucleus was heavier than its protons alone could explain. Chadwick found the missing piece: a particle with no charge. Nuclei are protons plus neutrons, which is why the same element can have different isotopes.', svg: '<circle cx="23" cy="24" r="8" fill="#d24a4a"/><circle cx="33" cy="26" r="8" fill="#8f98ab"/><circle cx="27" cy="34" r="8" fill="#8f98ab"/><circle cx="35" cy="36" r="8" fill="#d24a4a" opacity=".92"/>', lab: ['Explore isotopes (carbon-14 for example)', {Z: 6, N: 8}]},
  {y: '1932', who: 'Carl Anderson, USA', t: 'Antimatter', d: 'Anderson photographed a particle just like the electron, but with a positive charge: the positron. Every particle has an antiparticle, and when the two meet they vanish into light. Paul Dirac had predicted this on paper four years earlier.', svg: '<circle cx="20" cy="28" r="9" fill="#2a5db0"/><text x="20" y="33" text-anchor="middle" font-size="14" font-weight="700" fill="#fff" font-family="system-ui,sans-serif">−</text><circle cx="38" cy="28" r="9" fill="#d24a4a"/><text x="38" y="33" text-anchor="middle" font-size="14" font-weight="700" fill="#fff" font-family="system-ui,sans-serif">+</text>'},
  {y: '1938–1939', who: 'Otto Hahn and Fritz Strassmann, Germany; Lise Meitner and Otto Frisch, Austria and Sweden', t: 'Splitting the nucleus', d: 'Hahn and Strassmann hit uranium with neutrons and found barium, an element much lighter than uranium. Meitner and Frisch explained it: the nucleus had split in two, releasing a huge amount of energy, exactly as E = mc² says. This is nuclear fission, the source of nuclear power.', svg: '<circle cx="20" cy="28" r="10" fill="#d27a2a"/><circle cx="38" cy="28" r="10" fill="#d27a2a"/><path d="M28 8 L28 18 M28 38 L28 48" stroke="#e0b020" stroke-width="2"/>', lab: ['Look at uranium-235', {Z: 92, N: 143, zoom: 0}]},
  {y: '1964–1969', who: 'Gell-Mann and Zweig proposed it; experiments at SLAC (USA) confirmed it', t: 'Quarks', d: 'Protons and neutrons are not solid either. Each is made of three quarks, held together by the strong force and gluons. Electrons fired at protons bounced as if hitting three tiny points inside. Quarks have never been seen alone.', svg: '<circle cx="28" cy="20" r="7" fill="#e04a4a"/><circle cx="19" cy="35" r="7" fill="#3aa860"/><circle cx="37" cy="35" r="7" fill="#3a6ad8"/>', lab: ['Zoom into a proton to see quarks', {Z: 1, N: 0, zoom: 6}]},
  {y: '1981–1989', who: 'Gerd Binnig and Heinrich Rohrer, Switzerland; Don Eigler, USA', t: 'Seeing and moving single atoms', d: 'The scanning tunnelling microscope, from 1981, feels a surface with a needle that ends in a single atom, so it can show individual atoms as bumps. In 1989 Eigler used one to push 35 xenon atoms, one by one, into the letters "IBM".', svg: '<path d="M28 4 L28 22" stroke="#7a86a0" stroke-width="3"/><circle cx="14" cy="38" r="5" fill="#8f98ab"/><circle cx="26" cy="38" r="5" fill="#8f98ab"/><circle cx="38" cy="38" r="5" fill="#8f98ab"/><circle cx="20" cy="46" r="5" fill="#8f98ab"/><circle cx="32" cy="46" r="5" fill="#8f98ab"/>'},
  {y: '2002–2016', who: 'Scientists at Dubna, Russia and the USA', t: 'Oganesson: the last element', d: 'Element 118 was first made in 2002. Only three or four atoms have ever been detected, and each one lasts less than a millisecond (about 0.7 ms) before it falls apart. It was named in 2016 after the physicist Yuri Oganessian, one of only two people to have an element named after them while alive. It is the last element in this lab.', svg: '<circle cx="28" cy="28" r="14" fill="#8a6ad0"/><text x="28" y="33" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" font-family="system-ui,sans-serif">Og</text>', lab: ['Look at oganesson-294', {Z: 118, N: 176, zoom: 0}]},
  {y: '2012', who: 'CERN, Switzerland and France', t: 'The Higgs boson', d: 'The Large Hadron Collider found the Higgs boson, a piece of the field that gives electrons and quarks their mass. Most of a proton’s weight does not come from its quarks, though: it comes from the energy of the strong force that holds them together.', svg: '<circle cx="28" cy="28" r="3" fill="#e0b020"/><circle cx="28" cy="28" r="16" fill="none" stroke="#e0b020" stroke-width="2"/><circle cx="28" cy="28" r="23" fill="none" stroke="#e0b020" opacity=".4"/>'},
  {y: '2013', who: 'A European team led by Aneta Stodolna', t: 'Photographing an orbital', d: 'Physicists used a special microscope to capture the interference pattern of a hydrogen atom’s electron wave, with its rings and dark gaps. It is a direct picture of the quantum cloud, the same kind of shape you can open in the Cloud views here.', svg: '<circle cx="28" cy="28" r="20" fill="none" stroke="#2a5db0" stroke-width="2" opacity=".5"/><circle cx="28" cy="28" r="14" fill="none" stroke="#2a5db0" stroke-width="3" opacity=".75"/><circle cx="28" cy="28" r="7" fill="none" stroke="#2a5db0" stroke-width="3"/><circle cx="28" cy="28" r="2" fill="#2a5db0"/>', lab: ['Open the electron cloud', {Z: 1, N: 0, zoom: 0, view: "Cloud", orb: "2s"}]},
  {y: 'Today', who: 'Physicists everywhere', t: 'And it is still going', d: 'Electrons and quarks seem to have no size at all: they are as small as our best experiments can measure. Nobody knows yet whether they have parts. Perhaps one of you will find out.', svg: '<circle cx="28" cy="28" r="2.2" fill="#e0b020"/><circle cx="28" cy="28" r="9" fill="none" stroke="#e0b020" stroke-dasharray="2 3"/><circle cx="28" cy="28" r="18" fill="none" stroke="#e0b020" stroke-dasharray="1 4" opacity=".6"/>'},
