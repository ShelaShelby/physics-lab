# Builds the Windows version of Physics Lab (native/) and uploads PhysicsLab.exe
# as a downloadable artifact. Runs only when started by hand (Actions tab → Run workflow)
# or on a push to the `native` branch that changes native/ or this file, to save build minutes.
name: Native Windows build

on:
  workflow_dispatch:
  push:
    branches: [native]
    paths:
      - 'native/**'
      - '.github/workflows/native-windows.yml'

# a newer push cancels a build that is still running, so minutes are not spent twice
concurrency:
  group: native-windows-${{ github.ref }}
  cancel-in-progress: true

# needed to publish the "latest" release
permissions:
  contents: write

jobs:
  # 0.13 stage 1: the checks that need Linux tools. Every shader compiled by glslang (the Khronos reference compiler); 0.69.0 (OpenGL removed): the card
  # programs and the real renderer's pictures on Mesa's software Vulkan (lavapipe, with the validation layers) against the processor's references
  # (vk_compare_tests; until 0.68.1 gl_compare_tests on Mesa's software OpenGL). No Windows build, no release: it only says pass or fail.
  linux-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            native
            .github

      - name: Install glslang, software Vulkan and SDL's build needs (the app's dependencies are configured)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build glslang-tools mesa-vulkan-drivers libvulkan1 vulkan-validationlayers libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxfixes-dev libxss-dev libxtst-dev libxrender-dev libxinerama-dev libxkbcommon-dev libwayland-dev libdrm-dev libgbm-dev libdecor-0-dev

      - name: Configure (CMake, Ninja, with the Vulkan card and picture test)
        run: cmake -S native -B build -G Ninja -DPL_BUILD_APP=ON -DPL_VK_TESTS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build the card and picture test
        run: cmake --build build --target vk_compare_tests

      - name: Shader, card and picture checks
        env:
          PL_REQUIRE_GLSLANG: "1"
        run: ctest --test-dir build -R "glsl_shaders|vk_cards" --output-on-failure

  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            native
            .github

      - name: Configure (CMake, Visual Studio, 64-bit)
        run: cmake -S native -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      # 0.69.0 (OpenGL removed): the exe's imported DLLs, printed; the run fails if opengl32.dll is still among them
      - name: The exe imports no OpenGL
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -find "VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          if (-not $vs) { throw "dumpbin.exe not found" }
          $deps = & $vs /nologo /dependents build/Release/PhysicsLab.exe
          $deps | Write-Output
          if ($deps -match "(?i)opengl32") { throw "PhysicsLab.exe still imports opengl32.dll" }

      - name: Physics unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Font coverage on Windows (printed lists, for the report)
        run: ctest --test-dir build -C Release -R font_coverage -V

      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item build/Release/PhysicsLab.exe out/
          Copy-Item native/README.md out/
          New-Item -ItemType Directory -Force out/font-licences | Out-Null
          Copy-Item native/assets/fonts/OFL-*.txt out/font-licences/
          # 0.52.0: the licences of the two libraries built into the .exe, copied from the sources CMake fetched (the pinned tags of native/CMakeLists.txt)
          New-Item -ItemType Directory -Force out/licences | Out-Null
          Copy-Item build/_deps/sdl3-src/LICENSE.txt out/licences/SDL3-LICENSE.txt -ErrorAction Stop
          Copy-Item build/_deps/imgui-src/LICENSE.txt out/licences/DearImGui-LICENSE.txt -ErrorAction Stop
          # 0.59.0 (Vulkan step 1): volk and the Khronos Vulkan headers are built into the .exe too (glslang only runs at build time)
          Copy-Item build/_deps/volk-src/LICENSE.md out/licences/volk-LICENSE.md -ErrorAction Stop
          Copy-Item build/_deps/vulkanheaders-src/LICENSE.md out/licences/Vulkan-Headers-LICENSE.md -ErrorAction Stop
          Copy-Item build/_deps/vulkanheaders-src/LICENSES/Apache-2.0.txt out/licences/Vulkan-Headers-Apache-2.0.txt -ErrorAction Stop

      # (0.47.3: the account's artifact storage filled up and the failed upload stopped the release; the release does not need this copy, so a failed upload no
      # longer stops it, and the copies are kept 3 days instead of 30 so the storage does not fill again)
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: PhysicsLab-windows-x64
          path: out/
          retention-days: 3

      # The release title and text take the version from the same places the app does: the project VERSION in native/CMakeLists.txt (it becomes PL_VERSION)
      # and kStage in native/src/ui/changelog.cpp. While kStage is "alpha" or "beta" the release is marked Pre-release.
      # Replace the release tagged "latest" with this build, so it is always on one fixed page:
      # https://github.com/<owner>/<repo>/releases/tag/latest
      - name: Publish to the "latest" release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $appVer = (Select-String -Path native/CMakeLists.txt -Pattern 'project\(PhysicsLabNative VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          $ver = $appVer   # (0.22: read from CMakeLists.txt, no longer typed here)
          $stage = (Select-String -Path native/src/ui/changelog.cpp -Pattern 'kStage = "([^"]*)"').Matches[0].Groups[1].Value
          if (-not $appVer) { throw "No version found in native/CMakeLists.txt" }
          $label = if ($stage) { "$ver $stage" } else { $ver }
          Compress-Archive -Path out/* -DestinationPath PhysicsLab-windows-x64.zip -Force
          gh release delete latest --yes --cleanup-tag -R $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { Write-Host "No earlier 'latest' release to replace." }
          $notes = @"
          Physics Lab $label, newest Windows build, from commit $($env:GITHUB_SHA.Substring(0,7)) on branch $env:GITHUB_REF_NAME.

          Download PhysicsLab-windows-x64.zip, unzip it and run PhysicsLab.exe.

          If Windows warns you: the app is not code-signed, so Windows may show a reputation warning. This is not a sign that a virus was found. Before unzipping, right-click the zip, choose Properties, tick Unblock and press OK. Or, when "Windows protected your PC" (SmartScreen) appears, click More info, then Run anyway.
          "@
          $ghArgs = @('release', 'create', 'latest', 'PhysicsLab-windows-x64.zip', '-R', $env:GITHUB_REPOSITORY, '--target', $env:GITHUB_SHA, '--title', "Physics Lab $label (latest build)", '--notes', $notes)
          if ($stage -eq 'alpha' -or $stage -eq 'beta') { $ghArgs += '--prerelease' }
          gh @ghArgs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          exit 0

  # 0.85.1: the test package for the owner's PC (PhysicsLab-tests-windows-x64.zip, added to the "latest" release beside the app's zip, which is unchanged).
  # The GPU-against-CPU programs (vk_compare_tests: what ctest -R "glsl_shaders|vk_cards" runs on Linux; planet_picture and blackhole_picture: the CPU twins),
  # the UI check scripts and native/tools/pc_tests.ps1, the runner that does the real-hardware checks from one folder (CLAUDE.md "Build and test").
  # Its own job after the release, so the app's build and release never wait for it.
  test-package:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            native
            .github

      - name: Configure (with the Vulkan picture tests)
        run: cmake -S native -B build -A x64 -DPL_VK_TESTS=ON

      - name: Build the GPU-against-CPU programs
        run: cmake --build build --config Release --parallel --target vk_compare_tests planet_picture blackhole_picture

      - name: Collect and attach to the "latest" release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force tests-out/tests | Out-Null
          foreach ($t in 'vk_compare_tests', 'planet_picture', 'blackhole_picture') { Copy-Item "build/Release/$t.exe" tests-out/ -ErrorAction Stop }
          Copy-Item native/tools/pc_tests.ps1 tests-out/ -ErrorAction Stop
          Copy-Item native/tests/*.py tests-out/tests/ -ErrorAction Stop
          Copy-Item native/tests/TESTS.md tests-out/tests/ -ErrorAction Stop
          Copy-Item native/tests/reference tests-out/tests/reference -Recurse -ErrorAction Stop
          Copy-Item native/src/render/shaders.h tests-out/tests/ -ErrorAction Stop
          @"
          Physics Lab test package, commit $($env:GITHUB_SHA.Substring(0,7)).
          Unzip this and PhysicsLab-windows-x64.zip into one folder, then in PowerShell in that folder:
            powershell -ExecutionPolicy Bypass -File pc_tests.ps1
          The results are in results\pc-results.txt. Nothing is installed. The app uses its own settings file in results\.
          tests\ holds the UI check scripts (they need Python 3: python tests\<script>.py PhysicsLab.exe <work folder> [part]).
          "@ | Set-Content tests-out/README.txt -Encoding utf8
          Compress-Archive -Path tests-out/* -DestinationPath PhysicsLab-tests-windows-x64.zip -Force
          $rel = gh release view latest -R $env:GITHUB_REPOSITORY --json targetCommitish --jq .targetCommitish
          if ($rel -ne $env:GITHUB_SHA) { throw "the latest release targets $rel, not this commit $env:GITHUB_SHA" }
          gh release upload latest PhysicsLab-tests-windows-x64.zip --clobber -R $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { exit 1 }
